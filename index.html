async function accionImputar(ticketId) {
  const t = ticket(ticketId); if (!t) return;
  const dest = $('#impDest') ? $('#impDest').value : t.estadiaId;
  if (!dest) return toast('Seleccione la estadía activa de destino.', 'warn');
  const e = estadia(dest);
  if (!e || e.estado !== 'activa') return toast('La estadía de destino no está activa.', 'error');
  const ok = await confirmar({ titulo: 'Imputar consumo a parcela', ok: 'Confirmar imputación',
    html: `<p>Se cargará <b>${money(totalTicket(t))}</b> (ticket ${t.id}, ${t.mesaId}) a la cuenta de la estadía <b>${e.id}</b> en <b>${e.unidadId}</b> de ${esc(nombreCliente(cliente(e.clienteId)))}.</p><p class="sub small mt">Asiento B: Debe Créditos por cobrar a huéspedes · Haber Ingresos por gastronomía. La mesa quedará libre.</p>` });
  if (!ok) return;
  if (ticket(ticketId).estado !== 'abierto') return toast('Este ticket ya fue cerrado. No se duplica el cargo.', 'warn');
  ejecutar(() => imputarTicket(ticketId, dest), c => `Cargo ${c.id} (${c.op}) imputado a ${c.estadiaId}: ${money(c.importe)}.`);
}
async function accionPagoDirecto(v) {
  const [ticketId, medio] = v.split('|');
  const t = ticket(ticketId); if (!t) return;
  const ok = await confirmar({ titulo: 'Registrar pago directo', ok: 'Cobrar y cerrar cuenta',
    html: `<p>Cobrar <b>${money(totalTicket(t))}</b> en <b>${MEDIOS[medio].nombre}</b> y cerrar el ticket ${t.id} (${t.mesaId}).</p>${t.estadiaId ? `<p class="sub small mt">El consumo queda pagado: no se sumará a la cuenta de ${t.estadiaId} ni se volverá a cobrar en el check-out.</p>` : ''}<p class="sub small mt">Asiento D: Debe ${MEDIOS[medio].nombre === 'Efectivo' ? 'Caja' : 'Banco'} · Haber Ingresos por gastronomía.</p>` });

}

      </tbody>${cs.length ? `<tfoot><tr><td colspan="8">Total imputado</td><td class="num">${money(suma(cs, c => c.importe))}</td><td></td></tr></tfoot>` : ''}</table></div></div>`;
  } else if (tab === 'directos') {
    const ts = S.tickets.filter(t => t.estado === 'pagado').reverse();
    body = `<div class="card"><h3>Consumos pagados directamente (no se cobran en el check-out)</h3><div class="tw"><table><thead><tr><th>Ticket</th><th>Fecha</th><th>Mesa</th><th>Estadía asociada</th><th>Medio</th><th class="num">Importe</th><th>Asiento</th></tr></thead><tbody>
      ${ts.map(t => `<tr><td class="mono">${t.id}</td><td>${fFechaHora(t.cierre.fecha)}</td><td>${t.mesaId}</td><td>${t.estadiaId || '—'}</td><td>${MEDIOS[t.cierre.medio].nombre}</td><td class="num">${money(t.cierre.total)}</td><td class="mono">${t.cierre.asientoId}</td></tr>`).join('') || `<tr><td colspan="7">${vacio('Sin pagos directos')}</td></tr>`}
      </tbody>${ts.length ? `<tfoot><tr><td colspan="5">Total</td><td class="num">${money(suma(ts, t => t.cierre.total))}</td><td></td></tr></tfoot>` : ''}</table></div></div>`;
  } else {
    body = `<div class="row between mb"><span class="sub small">Stock ficticio. «Comprometido» = unidades en tickets abiertos (se descuentan al cerrar la cuenta).</span><button class="btn" type="button" data-a="nuevoProducto">+ Nuevo producto</button></div>

      ${S.productos.map(p => { const comp = comprometido(p.id); return `<tr><td class="mono">${p.id}</td><td><b>${esc(p.nombre)}</b></td><td>${esc(p.categoria)}</td><td class="num">${money(p.precio)}</td><td class="num">${money(p.costo)}</td><td class="num">${p.precio ? Math.round((p.precio - p.costo) / p.precio * 100) : 0} %</td><td class="num">${p.stock}</td><td class="num">${comp}</td><td class="num">${p.stock - comp <= APP.stockBajo ? `<span class="pill warn">${p.stock - comp}</span>` : p.stock - comp}</td><td>${p.activo ? '<span class="pill ok">Activo</span>' : '<span class="pill">Inactivo</span>'}</td><td class="row" style="flex-wrap:nowrap"><button class="btn ghost xs" type="button" data-a="editarProducto" data-v="${p.id}">Editar</button><button class="btn ghost xs" type="button" data-a="toggleProducto" data-v="${p.id}">${p.activo ? 'Desactivar' : 'Activar'}</button></td></tr>`; }).join('')}
      </tbody></table></div></div>`;
  }
  return `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab ${tab === k ? 'on' : ''}" type="button" role="tab" aria-selected="${tab === k}" data-a="tabConsumos" data-v="${k}">${l}</button>`).join('')}</div>${body}`;
};

    ${us.map(u => { const p = propietario(u.propietarioId); const ests = S.estadias.filter(e => e.unidadId === u.id && e.estado !== 'cancelada'); const liqs = S.liquidaciones.filter(l => l.unidadId === u.id); const lp = liqs.filter(l => l.estado !== 'Pagada').length; const cerradasSinLiq = ests.filter(e => e.estado === 'cerrada' && !liqs.some(l => l.estadiaId === e.id)).length;

      <td class="small">${ests.length ? ests.map(e => `<a href="#" data-a="verEstadia" data-v="${e.id}">${e.id}</a> <span class="sub">${ESTADO_EST_TXT[e.estado].split(' ')[0]}</span>`).join('<br>') : '—'}</td>
      <td><button class="btn ghost xs" type="button" data-a="editarUnidadTercero" data-v="${u.id}">Editar</button></td></tr>`; }).join('') || `<tr><td colspan="10">${vacio('Sin unidades de terceros')}</td></tr>`}
    </tbody></table></div></div>
  <div class="card mt"><h3>Liquidaciones</h3><div class="tw"><table><thead><tr><th>Liquidación</th><th>Fecha</th><th>Unidad</th><th>Estadía</th><th>Propietario</th><th class="num">Base</th><th class="num">Propietario</th><th class="num">Club</th><th>Estado</th><th></th></tr></thead><tbody>
    ${S.liquidaciones.slice().reverse().map(l => `<tr><td class="mono">${l.id}</td><td>${fFechaHora(l.fecha)}</td><td>${l.unidadId}</td><td><a href="#" data-a="verEstadia" data-v="${l.estadiaId}">${l.estadiaId}</a></td><td>${esc(propietario(l.propietarioId).nombre)}</td><td class="num">${money(l.base)}</td><td class="num">${money(l.importeProp)} <span class="sub tiny">${l.pctProp} %</span></td><td class="num">${money(l.importeClub)} <span class="sub tiny">${l.pctClub} %</span></td><td>${l.estado === 'Pagada' ? `<span class="pill ok">Pagada ${fFecha(l.pago.fecha.slice(0, 10))}</span>` : '<span class="pill warn">Pendiente de pago</span>'}</td>

/* =====================================================================
   13. CAJA Y CONTABILIDAD (vista)
   ===================================================================== */
function asientosFiltrados() {
  const f = UI.f, q = f.asQ.toLowerCase();
  return S.asientos.filter(a => (!f.asDesde || a.fecha.slice(0, 10) >= f.asDesde) && (!f.asHasta || a.fecha.slice(0, 10) <= f.asHasta) &&
    (!f.asCuenta || a.lineas.some(l => l.cuenta === f.asCuenta)) && (!f.asOrigen || a.origen === f.asOrigen) &&
    (!q || `${a.id} ${a.concepto} ${a.ref}`.toLowerCase().includes(q)));
}
VISTAS.caja = () => {
  const tab = UI.tabCaja;
  const sc = k => saldoCuenta(k);
  const sumaSaldos = suma(S.estadias.filter(e => e.estado === 'activa' || e.estado === 'cerrada'), e => resumenEstadia(e).saldo);
  const antPend = suma(S.pagos.filter(p => p.tipo === 'anticipo' && !p.aplicado && !p.devuelto), p => p.importe);
  const liqPend = suma(S.liquidaciones.filter(l => l.estado !== 'Pagada'), l => l.importeProp);
  const ctrl = [
    ['Créditos por cobrar = Σ saldos de estadías devengadas', sc('CRED').deudor, sumaSaldos],
    ['Anticipos de clientes = Σ anticipos sin aplicar', sc('ANT').acreedor, antPend],
    ['Cuentas por pagar a propietarios = Σ liquidaciones pendientes', sc('PROP').acreedor, liqPend],
    ['Ingresos por gastronomía = Σ tickets cerrados', sc('ING_GAS').acreedor, suma(S.tickets.filter(t => t.estado === 'pagado' || t.estado === 'imputado'), totalTicket)]
  ];
  const tabs = [['diario', 'Libro diario'], ['balance', 'Sumas y saldos'], ['tesoreria', 'Caja y bancos'], ['politica', 'Política contable']];
  let body = '';
  if (tab === 'diario') {
    const as = asientosFiltrados();
    const f = UI.f;
    let td = 0, th = 0;
    const filas = as.map(a => {
      const d = suma(a.lineas, l => l.debe), h = suma(a.lineas, l => l.haber), ok = Math.abs(d - h) <= APP.toleranciaCentavos;
      td += d; th += h;
      return a.lineas.map((l, i) => `<tr class="${i === 0 ? 'sep' : ''}"><td>${i === 0 ? fFechaHora(a.fecha) : ''}</td><td class="mono">${i === 0 ? a.id : ''}</td><td class="small">${i === 0 ? `${esc(a.concepto)} <span class="sub">· ref. ${esc(a.ref)}</span> ${pillOrigen(a.origen)}` : ''}</td><td class="small" style="padding-left:${l.haber ? 28 : 10}px">${esc(CUENTAS[l.cuenta].cod)} ${esc(CUENTAS[l.cuenta].nombre)}</td><td class="num">${l.debe ? money(l.debe) : ''}</td><td class="num">${l.haber ? money(l.haber) : ''}</td><td>${i === 0 ? (ok ? '<span class="pill ok">✓ Balanceado</span>' : '<span class="pill bad">✕ Error</span>') : ''}</td></tr>`).join('');
    }).join('');
    body = `<div class="filters">
      <div class="field"><label for="fAsD">Desde</label><input id="fAsD" type="date" data-f="asDesde" value="${esc(f.asDesde)}"></div>
      <div class="field"><label for="fAsH">Hasta</label><input id="fAsH" type="date" data-f="asHasta" value="${esc(f.asHasta)}"></div>
      <div class="field"><label for="fAsC">Cuenta</label><select id="fAsC" data-f="asCuenta"><option value="">Todas</option>${opciones(Object.entries(CUENTAS).map(([k, c]) => [k, c.cod + ' ' + c.nombre]), f.asCuenta)}</select></div>
      <div class="field"><label for="fAsO">Origen</label><select id="fAsO" data-f="asOrigen">${opciones([['', 'Todos'], ['demo', 'Datos iniciales'], ['usuario', 'Movimientos del usuario']], f.asOrigen)}</select></div>
      <div class="field" style="flex:1;min-width:160px"><label for="fAsQ">Buscar</label><input id="fAsQ" data-f="asQ" value="${esc(f.asQ)}" placeholder="Número, concepto o referencia"></div>
      <button class="btn ghost sm" type="button" data-a="limpiarFiltrosAs">Limpiar</button></div>
      <div class="card"><div class="tw"><table><thead><tr><th>Fecha</th><th>Número</th><th>Concepto</th><th>Cuenta</th><th class="num">Debe</th><th class="num">Haber</th><th>Estado</th></tr></thead>
      <tbody>${filas || `<tr><td colspan="7">${vacio('Sin asientos para los filtros elegidos')}</td></tr>`}</tbody>
      ${as.length ? `<tfoot><tr><td colspan="4">Totales (${as.length} asientos)</td><td class="num">${money(td)}</td><td class="num">${money(th)}</td><td>${td === th ? '<span class="pill ok">Debe = Haber</span>' : '<span class="pill bad">Diferencia</span>'}</td></tr></tfoot>` : ''}</table></div></div>`;
  } else if (tab === 'balance') {
    let tD = 0, tH = 0;
    const filas = Object.entries(CUENTAS).map(([k, c]) => { const s = sc(k); tD += s.debe; tH += s.haber; return `<tr><td class="mono">${c.cod}</td><td>${esc(c.nombre)}</td><td>${c.tipo}</td><td class="num">${money(s.debe)}</td><td class="num">${money(s.haber)}</td><td class="num">${s.deudor > 0 ? money(s.deudor) : ''}</td><td class="num">${s.deudor < 0 ? money(-s.deudor) : ''}</td></tr>`; }).join('');
    body = `<div class="card"><h3>Balance de sumas y saldos</h3><div class="tw"><table><thead><tr><th>Código</th><th>Cuenta</th><th>Tipo</th><th class="num">Debe</th><th class="num">Haber</th><th class="num">Saldo deudor</th><th class="num">Saldo acreedor</th></tr></thead><tbody>${filas}</tbody>
      <tfoot><tr><td colspan="3">Totales</td><td class="num">${money(tD)}</td><td class="num">${money(tH)}</td><td colspan="2">${tD === tH ? '<span class="pill ok">Balanceado</span>' : '<span class="pill bad">Descuadre</span>'}</td></tr></tfoot></table></div>
      <p class="sub small mt">«Inventario gastronómico» se incluye como cuenta de referencia: la demo controla el stock en unidades y no registra costo de ventas.</p></div>`;
  } else if (tab === 'tesoreria') {
    const movs = [];
    S.asientos.forEach(a => a.lineas.forEach(l => { if (l.cuenta === 'CAJA' || l.cuenta === 'BANCO') movs.push({ a, l }); }));
    let saldoC = 0, saldoB = 0;
    const filas = movs.map(({ a, l }) => { if (l.cuenta === 'CAJA') saldoC += l.debe - l.haber; else saldoB += l.debe - l.haber; return `<tr><td>${fFechaHora(a.fecha)}</td><td class="mono">${a.id}</td><td class="small">${esc(a.concepto)}</td><td>${CUENTAS[l.cuenta].nombre}</td><td class="num" style="color:var(--ok)">${l.debe ? money(l.debe) : ''}</td><td class="num" style="color:var(--bad)">${l.haber ? money(l.haber) : ''}</td><td class="num">${money(l.cuenta === 'CAJA' ? saldoC : saldoB)}</td></tr>`; }).reverse().join('');
    body = `<div class="card"><h3>Movimientos de caja y bancos</h3><div class="tw"><table><thead><tr><th>Fecha</th><th>Asiento</th><th>Concepto</th><th>Cuenta</th><th class="num">Ingreso</th><th class="num">Egreso</th><th class="num">Saldo de la cuenta</th></tr></thead><tbody>${filas || `<tr><td colspan="7">${vacio('Sin movimientos')}</td></tr>`}</tbody></table></div></div>`;
  } else {

function barras(items, total) {
  return items.length ? `<div class="tw"><table><tbody>${items.map(([l, v, extra]) => `<tr><td>${l}</td><td style="width:40%"><div class="bar"><i style="width:${total ? Math.max(2, v / total * 100) : 0}%"></i></div></td><td class="num">${money(v)}</td>${extra !== undefined ? `<td class="num sub small">${extra}</td>` : ''}</tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td></td><td class="num">${money(total)}</td>${items[0][2] !== undefined ? '<td></td>' : ''}</tr></tfoot></table></div>` : vacio('Sin registros', 'No hay datos para el período o filtro elegido.');
}

/* ---------- Pruebas ejecutables ---------- */
function enSandbox(fn) {
  const prevS = S, prevActivo = PERSIST.activo, prevO = ORIGEN, prevClock = CLOCK.override;
  PERSIST.activo = false;
  try { S = construirSeed(); ORIGEN = 'usuario'; return fn(); }
  finally { S = prevS; PERSIST.activo = prevActivo; ORIGEN = prevO; CLOCK.override = prevClock; }
}
function esperar(cond, msg) { if (!cond) throw new Error(msg); }
function lanza(fn) { try { transaccion(fn); return null; } catch (e) { return e; } }
function ejecutarPruebas() {
  const H = hoy();
  const P = [
    ['Estadía de dos noches calcula correctamente el precio', () => {

  return P.map(([nombre, fn], i) => {
    try { return { n: i + 1, nombre, ok: true, detalle: fn() }; }
    catch (e) { return { n: i + 1, nombre, ok: false, detalle: e.message }; }
  });
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el) {
    if ($('#app').classList.contains('open') && !ev.target.closest('.sb') && !ev.target.closest('#burger')) $('#app').classList.remove('open');
    return;
  }
  if (el.disabled) return;
  const fn = ACCIONES[el.dataset.a];
  if (!fn) return;
  ev.preventDefault();
  if (el.tagName === 'BUTTON' && !/^(go|sel|ver|tab|nueva|nuevo|editar|limpiar)/.test(el.dataset.a)) { el.disabled = true; setTimeout(() => { if (document.contains(el)) el.disabled = false; }, 600); }
  fn(el.dataset.v, el);
});
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('unit')) { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  if (ev.key === 'Escape' && $('#app').classList.contains('open')) $('#app').classList.remove('open');
});
document.addEventListener('input', ev => {
  const k = ev.target.dataset && ev.target.dataset.f;
  if (k) { UI.f[k] = ev.target.value; render(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.f && t.tagName === 'SELECT') { UI.f[t.dataset.f] = t.value; render(); }
  if (t.dataset && t.dataset.ticketEstadia) ejecutar(() => asociarEstadiaTicket(t.dataset.ticketEstadia, t.value || null), x => x.estadiaId ? `Ticket ${x.id} asociado a ${x.estadiaId}.` : `Ticket ${x.id} sin parcela asociada.`);
});
document.addEventListener('submit', ev => {
  if (ev.target.id === 'fCfg') { ev.preventDefault(); const fd = formData(ev.target); fd.recargoSobreAdicionales = fd.recargoSobreAdicionales === 'on'; ejecutar(() => guardarConfig(fd), 'Parámetros guardados. Aplican a nuevas estadías.'); }
  if (ev.target.id === 'fTemp') { ev.preventDefault(); ejecutar(() => agregarTemporada(formData(ev.target)), 'Período de temporada alta agregado.'); }
});
$('#burger').addEventListener('click', ev => { ev.stopPropagation(); $('#app').classList.toggle('open'); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TITULOS[h] && h !== UI.route) { UI.route = h; render(); } });

/* =====================================================================
   16. INICIALIZACIÓN
   ===================================================================== */
function init() {
  cargarInicial();
  const h = location.hash.slice(1);
  if (TITULOS[h]) UI.route = h;
  render();
  if (PERSIST.problema === 'sin-storage') toast('Almacenamiento local no disponible: la demo funciona en memoria.', 'info');
  // Reloj del encabezado: refresca la fecha si cambia el día con la app abierta
  let dia = hoy();
  setInterval(() => { if (hoy() !== dia) { dia = hoy(); render(); } }, 60000);
}
window.SVB = { ejecutarPruebas, estado: () => S, version: APP.schema };
init();
</script>
