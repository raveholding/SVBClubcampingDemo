<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club de Camping · Sistema VB (Demo)</title>
<meta name="description" content="Demo funcional del Sistema Integral de Gestión de Clubes de Camping: predio, estadías, gastronomía, pileta y canchas, subalquileres y contabilidad. Datos ficticios.">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ESTILOS
   ===================================================================== */
:root{
  --bg:#0e1311;--panel:#151c19;--panel2:#1b2420;--panel3:#222d28;--line:#2a3631;--line2:#34433c;
  --tx:#eef3ef;--mut:#93a39a;--mut2:#6f7f77;
  --acc:#7ccf9a;--acc2:#a9e6bd;--accTx:#0b1f13;
  --libre:#3fb96b;--ocupada:#e05a4f;--reservada:#e8b931;--mant:#7c8580;
  --ok:#5fcf8a;--warn:#e8b931;--bad:#ef6a5f;--info:#6aaef0;
  --r:16px;--sh:0 10px 30px rgba(0,0,0,.35);--sb:252px;--topbg:rgba(14,19,17,.9);color-scheme:dark;
  font-family:"Inter","Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;
}

/* Tema claro (el oscuro es el predeterminado) */
:root[data-theme="light"]{
  --bg:#f3f6f1;--panel:#ffffff;--panel2:#eef3ec;--panel3:#e2e9df;--line:#dbe3d8;--line2:#c5d0c1;
  --tx:#17211b;--mut:#55625a;--mut2:#7a867e;
  --acc:#2c7a4d;--acc2:#1f6841;--accTx:#ffffff;
  --libre:#2fa65c;--ocupada:#d6483c;--reservada:#d9a413;--mant:#7c8580;
  --ok:#1c8a4b;--warn:#9a6a00;--bad:#c63a2e;--info:#2467ad;
  --sh:0 10px 30px rgba(30,50,40,.12);--topbg:rgba(243,246,241,.9);color-scheme:light;
}
:root[data-theme="light"] .nav a.on{background:rgba(44,122,77,.12);box-shadow:inset 0 0 0 1px rgba(44,122,77,.35)}
:root[data-theme="light"] .pill.mant{color:#4d5651;border-color:#aab3ad;background:rgba(124,133,128,.14)}
:root[data-theme="light"] .errors,:root[data-theme="light"] .notice.bad{color:#a32a20}
:root[data-theme="light"] .notice.warn{color:#775300}
:root[data-theme="light"] .notice.ok{color:#17653a}
:root[data-theme="light"] .notice.info{color:#1d5a96}
:root[data-theme="light"] .btn.warnb{color:#fff}
:root[data-theme="light"] table.agenda td.slot.past{background:rgba(0,0,0,.025)}
.btn.tema{min-width:98px;justify-content:center}
/* Sitio público para nuevos socios */
.app.pub{display:block}
.app.pub .sb,.app.pub .top,.app.pub #banners{display:none}
.app.pub .content{max-width:1120px;padding:0 20px 56px}
.pubbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--topbg);backdrop-filter:blur(12px);z-index:40;margin:0 -20px;padding-left:20px;padding-right:20px}
.pubbar .brand{padding:0;flex:1;min-width:180px}
.pubbar .lk{color:var(--mut);text-decoration:none;font-weight:500;padding:6px 8px;border-radius:8px;cursor:pointer;background:none;border:0;font:inherit}
.pubbar .lk:hover{color:var(--tx);background:var(--panel2)}
.hero{padding:54px 0 36px;display:grid;gap:16px;max-width:760px}
.hero .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);font-weight:650}
.hero h2{font-size:clamp(30px,6vw,48px);line-height:1.08;letter-spacing:-.03em;font-weight:700}
.hero p{color:var(--mut);font-size:16.5px;max-width:60ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn.lg{padding:13px 22px;font-size:15px;border-radius:13px}
.pubsec{padding:30px 0 6px}
.pubsec>h3{font-size:22px;letter-spacing:-.02em;margin-bottom:4px}
.pubsec>.lead{color:var(--mut);margin-bottom:16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px}
.plan.dest{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.plan h4{font-size:17px}
.plan .precio{font-size:28px;font-weight:700;letter-spacing:-.02em}
.plan .precio small{font-size:13px;font-weight:500;color:var(--mut)}
.plan ul{list-style:none;display:grid;gap:6px;color:var(--mut);font-size:13.5px;margin-top:4px}
.plan li::before{content:"✓ ";color:var(--acc2);font-weight:700}
.pubtabla td:last-child,.pubtabla th:last-child{text-align:right;white-space:nowrap}
.carta{columns:2 280px;column-gap:28px}
.carta .it{break-inside:avoid;display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.carta h5{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);margin:14px 0 4px;break-inside:avoid}
.pubfoot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:13px;display:grid;gap:4px}
.solic{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.solic:last-child{border-bottom:0}
@media (max-width:640px){.hero{padding-top:34px}.pubbar .lk.hide-s{display:none}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-size:14.5px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.app{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
/* Sidebar */
.sb{background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px;z-index:60}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2f6b46,#173524);display:grid;place-items:center;flex:none}
.brand b{font-size:14px;line-height:1.15;display:block}
.brand small{display:block;color:var(--mut);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;color:var(--mut);text-decoration:none;font-weight:500;cursor:pointer;white-space:nowrap}
.nav a:hover{background:var(--panel2);color:var(--tx)}
.nav a.on{background:rgba(124,207,154,.14);color:var(--acc2);box-shadow:inset 0 0 0 1px rgba(124,207,154,.3)}
.nav .ic{width:20px;height:20px;flex:none;display:grid;place-items:center}
.nav .ic svg{width:18px;height:18px}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.nav .badge{margin-left:auto;background:var(--panel3);color:var(--tx);border-radius:99px;font-size:11px;padding:1px 7px}
.sbfoot{margin-top:auto;padding:12px 8px 0;color:var(--mut2);font-size:11.5px;line-height:1.4}
/* Topbar */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--topbg);backdrop-filter:blur(12px);z-index:40}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .club{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer}
.datebox{text-align:right;color:var(--mut);font-size:12.5px;line-height:1.25;white-space:nowrap}
.datebox b{color:var(--tx);font-size:14px;display:block}
.banner{margin:14px 28px 0;padding:11px 14px;border-radius:12px;border:1px solid;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.banner.warn{border-color:rgba(232,185,49,.45);background:rgba(232,185,49,.08)}
.banner.info{border-color:rgba(106,174,240,.45);background:rgba(106,174,240,.08)}
.banner.bad{border-color:rgba(239,106,95,.45);background:rgba(239,106,95,.08)}
.content{padding:24px 28px 40px;max-width:1560px;width:100%;margin:0 auto;flex:1}
/* Layout */
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s9{grid-column:span 9}.s12{grid-column:span 12}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card>h3,.h3{font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.kpi .l{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);font-weight:600}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{color:var(--mut);font-size:12.5px;margin-top:2px}
.kpi.acc .v{color:var(--acc2)}.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}
.sub,.mut{color:var(--mut)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:nowrap}
#view:focus{outline:none}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:14px}.mt2{margin-top:22px}.mb{margin-bottom:14px}
.hr{height:1px;background:var(--line);margin:14px 0}
/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap;line-height:1.6}
.pill.ok,.pill.libre{color:var(--ok);border-color:rgba(95,207,138,.45);background:rgba(95,207,138,.07)}
.pill.warn,.pill.reservada{color:var(--warn);border-color:rgba(232,185,49,.45);background:rgba(232,185,49,.07)}
.pill.bad,.pill.ocupada{color:var(--bad);border-color:rgba(239,106,95,.45);background:rgba(239,106,95,.07)}
.pill.info{color:var(--info);border-color:rgba(106,174,240,.45);background:rgba(106,174,240,.07)}
.pill.mant{color:#b9c1bc;border-color:#5d6661;background:rgba(124,133,128,.12)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
/* Buttons */
.btn{background:var(--acc);color:var(--accTx);border:0;border-radius:11px;padding:9px 15px;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;display:inline-flex;align-items:center;gap:7px;justify-content:center;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--acc2)}
.btn[disabled],.btn.busy{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.xs{padding:3px 9px;font-size:12px;border-radius:8px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(239,106,95,.45)}
.btn.danger:hover{background:rgba(239,106,95,.1)}
.btn.warnb{background:var(--warn);color:#271d00}
.btn.big{padding:12px 18px;font-size:15px}
.btn.block{width:100%}
/* Forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field>label{font-size:11.5px;color:var(--mut);letter-spacing:.07em;text-transform:uppercase;font-weight:500}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--acc)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none}
input.err,select.err{border-color:var(--bad)}
textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.check{display:flex;gap:8px;align-items:center;margin-bottom:12px;color:var(--tx);font-size:13.5px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:11px;overflow:hidden;margin-bottom:12px}
.seg label{padding:7px 14px;cursor:pointer;color:var(--mut);font-size:13.5px}
.seg input{display:none}
.seg label:has(input:checked){background:var(--panel3);color:var(--tx)}
.errors{background:rgba(239,106,95,.08);border:1px solid rgba(239,106,95,.4);color:#ffb3ab;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.errors li{margin-left:18px}
.notice{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;border:1px solid}
.notice.warn{background:rgba(232,185,49,.08);border-color:rgba(232,185,49,.4);color:#f3d77c}
.notice.ok{background:rgba(95,207,138,.08);border-color:rgba(95,207,138,.4);color:#a6ecc0}
.notice.info{background:rgba(106,174,240,.08);border-color:rgba(106,174,240,.4);color:#b4d6fa}
.notice.bad{background:rgba(239,106,95,.08);border-color:rgba(239,106,95,.4);color:#ffb3ab}
/* Tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--panel2)}
tfoot td{font-weight:650;border-top:1px solid var(--line2);border-bottom:0}
tr.sep td{border-top:2px solid var(--line2)}
table.calc td{padding:6px 4px;border-bottom:1px dashed var(--line)}
table.calc tr.tot td{font-weight:700;border-top:1px solid var(--line2);border-bottom:0;font-size:15px}
table.calc tr.neg td.num{color:var(--ok)}
table.calc .ix{color:var(--mut2);width:22px}
.empty{color:var(--mut);padding:22px 12px;text-align:center;font-size:13.5px}
.empty b{display:block;color:var(--tx);font-weight:600;margin-bottom:3px}
/* Tabs / chips */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.tab{border:1px solid var(--line2);background:var(--panel);border-radius:99px;padding:7px 15px;cursor:pointer;white-space:nowrap;color:var(--mut);font-weight:500}
.tab.on{background:var(--acc);color:var(--accTx);border-color:var(--acc);font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filters .field{margin:0;min-width:140px}
/* Map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.map{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.map svg{width:100%;height:auto;display:block;border-radius:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 6px 2px;font-size:13px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.unit{cursor:pointer;outline:none}
.unit .shape{stroke:rgba(0,0,0,.35);stroke-width:2;transition:filter .15s}
.unit:hover .shape,.unit:focus .shape{filter:brightness(1.18)}
.unit.sel .ring{stroke:#fff;stroke-width:3.5;fill:none}
.unit text{pointer-events:none;font-family:inherit}
.side{position:sticky;top:78px}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.detail dt{color:var(--mut)}
.detail dd{text-align:right;font-variant-numeric:tabular-nums}
.detail dd.big{font-size:17px;font-weight:700}
.lines td{padding:7px 6px}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:700;line-height:1}
.qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
/* Bars */
.bar{height:8px;background:var(--panel3);border-radius:99px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
.occ{height:12px;background:var(--panel3);border-radius:99px;overflow:hidden;display:flex}
.occ i{display:block;height:100%}
/* Lists */
.list{display:flex;flex-direction:column}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
/* Dialog */
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line2);border-radius:20px;padding:0;width:min(640px,96vw);max-height:94vh;box-shadow:0 30px 80px rgba(0,0,0,.6);margin:auto}
dialog.wide{width:min(940px,96vw)}
dialog.narrow{width:min(460px,96vw)}
dialog::backdrop{background:rgba(3,8,5,.7);backdrop-filter:blur(3px)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-h h2{font-size:18px;font-weight:650}
.dlg-x{background:none;border:1px solid var(--line2);border-radius:9px;width:32px;height:32px;cursor:pointer;color:var(--mut);font-size:16px}
.dlg-b{padding:18px 22px;overflow:auto;max-height:calc(94vh - 140px)}
.dlg-f{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--line);background:var(--panel);position:sticky;bottom:0}
.dlg-f .left{margin-right:auto}
/* Toasts */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(420px,92vw)}
.toast{background:var(--panel3);border:1px solid var(--line2);border-left:4px solid var(--ok);padding:11px 14px;border-radius:12px;box-shadow:var(--sh);font-size:13.5px;animation:tin .25s ease-out}
.toast.warn{border-left-color:var(--warn)}.toast.error{border-left-color:var(--bad)}.toast.info{border-left-color:var(--info)}
.toast b{display:block;margin-bottom:1px}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* Comprobante */
.voucher{background:#fbfbf7;color:#1a1f1c;border-radius:14px;padding:20px;font-size:13.5px}
.voucher h4{font-size:16px;margin-bottom:4px}
.voucher table td,.voucher table th{border-color:#ddd;color:#1a1f1c}
.voucher .mut{color:#6a726d}
/* Pileta y canchas */
.halo{fill:none;pointer-events:none;transition:filter .15s}
.unit:hover .halo,.unit:focus .halo{filter:brightness(1.35)}
.mt-s{margin-top:4px}
.list .it[data-a]{cursor:pointer;border-radius:8px;padding-left:6px;padding-right:6px}
.list .it[data-a]:hover{background:var(--panel2)}
table.agenda{table-layout:fixed;min-width:620px}
table.agenda th{text-align:center}
table.agenda th:first-child{width:72px}
table.agenda td.hr0{color:var(--mut);font-variant-numeric:tabular-nums;font-weight:600;width:72px}
table.agenda td.slot{padding:6px 8px;border:1px solid var(--line);vertical-align:top;font-size:12.5px;height:48px;overflow:hidden}
table.agenda td.slot.free{background:rgba(63,185,107,.06)}
table.agenda td.slot.reservada{background:rgba(232,185,49,.14);cursor:pointer}
table.agenda td.slot.cobrada{background:rgba(95,207,138,.15);cursor:pointer}
table.agenda td.slot.imputada{background:rgba(106,174,240,.15);cursor:pointer}

    if (d.pagoInicial && d.pagoInicial.importe) {
      const imp = d.pagoInicial.importe;
      if (!Number.isInteger(imp) || imp <= 0) errs.push('El pago inicial debe ser un importe positivo.');
      else if (imp > calc.total) errs.push('El pago inicial no puede superar el total del alojamiento.');
      if (!MEDIOS[d.pagoInicial.medio]) errs.push('Seleccione un medio de pago válido.');
    }
  }
  return errs;
}
function validarCliente(d, exceptoId) {
  const errs = [];
  if (!limpiar(d.nombre)) errs.push('El nombre es obligatorio.');
  if (!limpiar(d.apellido)) errs.push('El apellido es obligatorio.');
  const doc = String(d.doc || '').replace(/\D/g, '');
  if (doc.length < 7 || doc.length > 11) errs.push('El documento debe tener entre 7 y 11 dígitos.');
  else if (S.clientes.some(c => c.id !== exceptoId && c.doc.replace(/\D/g, '') === doc)) errs.push('Ya existe un cliente con ese documento.');
  if (!/^[+\d\s()-]{6,25}$/.test(String(d.tel || ''))) errs.push('Ingrese un teléfono válido.');
  if (!CATEGORIAS_CLIENTE.includes(d.categoria)) errs.push('Categoría inválida.');
  if (d.esSocio) {
    if (!['Activo', 'Suspendido'].includes(d.estadoSocio)) errs.push('Indique el estado del socio.');
    if (!esFechaISO(d.cuotaVence)) errs.push('Indique la fecha de vencimiento de la cuota.');
  }
  return errs;
}
/** Verificación global: el libro debe cuadrar siempre (Debe = Haber). */
function verificarLibroBalanceado() {
  for (const a of S.asientos) {
    const d = suma(a.lineas, l => l.debe), h = suma(a.lineas, l => l.haber);
    if (Math.abs(d - h) > APP.toleranciaCentavos) throw new ErrNegocio(`El asiento ${a.id} no cuadra.`);
  }
}
function validarAsiento(lineas) {
  if (!Array.isArray(lineas) || lineas.length < 2) throw new ErrNegocio('Un asiento requiere al menos dos líneas.');
  for (const l of lineas) {
    if (!CUENTAS[l.cuenta]) throw new ErrNegocio('Cuenta contable inexistente: ' + l.cuenta);
    if (!Number.isInteger(l.debe) || !Number.isInteger(l.haber) || l.debe < 0 || l.haber < 0) throw new ErrNegocio('Importes de asiento inválidos.');
    if (l.debe > 0 && l.haber > 0) throw new ErrNegocio('Una línea no puede tener importe al Debe y al Haber.');
  }
  const d = suma(lineas, l => l.debe), h = suma(lineas, l => l.haber);
  if (d === 0) throw new ErrNegocio('El asiento no tiene importes.');
  if (Math.abs(d - h) > APP.toleranciaCentavos) throw new ErrNegocio(`Asiento descuadrado: Debe ${money(d)} ≠ Haber ${money(h)}.`);
  return { debe: d, haber: h };
}

/* ---------- Identificadores y bitácora ---------- */
function nextId(key, prefix, w = 4) { S.seq[key] = (S.seq[key] || 0) + 1; return `${prefix}-${String(S.seq[key]).padStart(w, '0')}`; }
function bitacora(texto, ref) {
  S.log.unshift({ fecha: ahora(), texto, ref: ref || '', origen: ORIGEN });
  if (S.log.length > 80) S.log.length = 80;
}
/** Marca una operación como hecha; impide duplicados por doble clic o reintentos. */
function marcarOperacion(clave) {
  if (S.opsHechas[clave]) throw new ErrNegocio('La operación ya fue registrada anteriormente (' + clave + '). No se duplica.', 'DUPLICADO');
  S.opsHechas[clave] = ahora();
}

/* =====================================================================
   13. CONTABILIDAD — registro de asientos (usado por todas las operaciones)
   Política de la demo: RECONOCIMIENTO BRUTO.
   · La estadía se devenga completa al hacer el check-in (Créditos / Ingresos por estadía),
     con el descuento de socio en una cuenta separada (Descuentos otorgados).
   · En unidades de terceros, al cerrar la estadía se reclasifica la parte del propietario:
     Debe Ingresos por estadía / Haber Cuentas por pagar a propietarios. El ingreso que queda
     es la comisión del club. Nunca se registra la estadía por el neto.
   ===================================================================== */
function registrarAsiento({ concepto, ref, refTipo, lineas }) {
  const ls = lineas.filter(l => (l.debe || 0) > 0 || (l.haber || 0) > 0).map(l => ({ cuenta: l.cuenta, debe: l.debe || 0, haber: l.haber || 0 }));
  validarAsiento(ls);
  const a = { id: nextId('as', 'AS', 5), fecha: ahora(), concepto, ref: ref || '', refTipo: refTipo || '', lineas: ls, estado: 'Registrado', origen: ORIGEN };
  S.asientos.push(a);
  return a;
}

/* =====================================================================

function crearCliente(d) {

function editarCliente(id, d) {

/* =====================================================================
   8. GESTIÓN DE ESTADÍAS (reservas, check-in, pagos, check-out)
   ===================================================================== */
function crearEstadia(d) {
  const errs = validarEstadia(d);
  if (errs.length) throw new ErrNegocio(errs.join(' '));
  const calc = calcularAlojamiento(d);
  const esCheckin = d.ingreso <= hoy();
  const e = {
    id: nextId('est', 'E'), unidadId: d.unidadId, clienteId: d.clienteId, ingreso: d.ingreso, salida: d.salida,
    personas: calc.personas, vehiculos: calc.vehiculos, patentes: limpiar(d.patentes, 80), tipo: calc.tipo, calc,
    estado: esCheckin ? 'activa' : 'reservada', creada: ahora(), checkin: esCheckin ? ahora() : null, cierre: null,
    notas: limpiar(d.notas, 200), origen: ORIGEN
  };
  S.estadias.push(e);
  if (esCheckin) devengarEstadia(e);
  if (d.pagoInicial && d.pagoInicial.importe > 0) registrarPago(e.id, d.pagoInicial.importe, d.pagoInicial.medio, esCheckin ? 'Pago al ingreso' : 'Anticipo de reserva');
  bitacora(`${esCheckin ? 'Check-in' : 'Reserva'} ${e.id} en ${e.unidadId} — ${nombreCliente(cliente(e.clienteId))}`, e.id);
  return e;
}
/** Asiento A: devengamiento de la estadía + aplicación de anticipos (E → C). */
function devengarEstadia(e) {
  marcarOperacion('devengo:' + e.id);
  const a = registrarAsiento({
    concepto: `Devengamiento estadía ${e.id} (${e.unidadId}, ${e.calc.noches} noches)`, ref: e.id, refTipo: 'estadia',
    lineas: [
      { cuenta: 'CRED', debe: e.calc.total },
      { cuenta: 'DESC', debe: e.calc.descuento },
      { cuenta: 'ING_EST', haber: e.calc.subtotal }
    ]
  });
  e.asientoDevengo = a.id;
  pagosDeEstadia(e.id).filter(p => p.tipo === 'anticipo' && !p.aplicado).forEach(p => {
    const ap = registrarAsiento({ concepto: `Aplicación de anticipo ${p.id} a estadía ${e.id}`, ref: e.id, refTipo: 'estadia', lineas: [{ cuenta: 'ANT', debe: p.importe }, { cuenta: 'CRED', haber: p.importe }] });
    p.aplicado = true; p.asientoAplicacion = ap.id;
  });
}
/** Pago imputado a la estadía. Reserva → anticipo (E). Activa/cerrada → cobro de deuda (C). */
function registrarPago(estadiaId, importe, medio, concepto) {
  const e = estadia(estadiaId);
  if (!e) throw new ErrNegocio('La estadía no existe.');
  if (e.estado === 'cancelada') throw new ErrNegocio('La estadía está cancelada.');
  if (!Number.isInteger(importe) || importe <= 0) throw new ErrNegocio('Ingrese un importe positivo.');
  if (!MEDIOS[medio]) throw new ErrNegocio('Seleccione un medio de pago válido.');
  const r = resumenEstadia(e);
  if (importe > r.saldo) throw new ErrNegocio(`El importe supera el saldo pendiente (${money(r.saldo)}).`);
  const esAnticipo = e.estado === 'reservada';
  const a = registrarAsiento({
    concepto: `${esAnticipo ? 'Anticipo recibido' : 'Cobro'} ${e.id} — ${MEDIOS[medio].nombre}`, ref: e.id, refTipo: 'estadia',
    lineas: [{ cuenta: MEDIOS[medio].cuenta, debe: importe }, { cuenta: esAnticipo ? 'ANT' : 'CRED', haber: importe }]
  });
  const p = { id: nextId('pag', 'PG'), estadiaId: e.id, clienteId: e.clienteId, tipo: esAnticipo ? 'anticipo' : 'pago', medio, importe, fecha: ahora(), concepto: limpiar(concepto || (esAnticipo ? 'Anticipo' : 'Pago'), 80), asientoId: a.id, aplicado: !esAnticipo, devuelto: false, origen: ORIGEN };
  S.pagos.push(p);
  bitacora(`${esAnticipo ? 'Anticipo' : 'Pago'} ${money(importe)} (${MEDIOS[medio].nombre}) en ${e.id}`, e.id);
  return p;
}
function checkInReserva(id) {
  const e = estadia(id);
  if (!e) throw new ErrNegocio('La reserva no existe.');
  if (e.estado !== 'reservada') throw new ErrNegocio('Solo se puede hacer check-in de una reserva pendiente.');
  const u = unidad(e.unidadId);
  if (u.mantenimiento) throw new ErrNegocio(`La unidad ${u.id} está en mantenimiento.`);
  if (hoy() < e.ingreso) throw new ErrNegocio(`La reserva comienza el ${fFecha(e.ingreso)}. Para ingresar antes, modifique las fechas.`);
  if (hoy() >= e.salida) throw new ErrNegocio('La fecha de salida de la reserva ya pasó. Modifíquela o cancélela.');
  const act = estadiaActivaDeUnidad(u.id);
  if (act) throw new ErrNegocio(`La unidad ${u.id} todavía tiene un huésped alojado (${act.id}).`);
  e.estado = 'activa'; e.checkin = ahora();
  devengarEstadia(e);
  bitacora(`Check-in de la reserva ${e.id} en ${e.unidadId}`, e.id);
  return e;
}
function modificarReserva(id, d) {
  const e = estadia(id);
  if (!e) throw new ErrNegocio('La reserva no existe.');
  if (e.estado !== 'reservada') throw new ErrNegocio('Solo se pueden modificar reservas pendientes (las estadías activas ya están devengadas).');
  const datos = { ...d, unidadId: e.unidadId, clienteId: e.clienteId };
  const errs = validarEstadia(datos, e.id);
  if (errs.length) throw new ErrNegocio(errs.join(' '));
  const calc = calcularAlojamiento(datos);
  const ant = suma(pagosDeEstadia(e.id), p => p.importe);
  if (ant > calc.total) throw new ErrNegocio(`Los anticipos (${money(ant)}) superan el nuevo total (${money(calc.total)}).`);
  Object.assign(e, { ingreso: datos.ingreso, salida: datos.salida, personas: calc.personas, vehiculos: calc.vehiculos, patentes: limpiar(datos.patentes, 80), tipo: calc.tipo, calc });
  bitacora(`Reserva ${e.id} modificada (${fFecha(e.ingreso)} → ${fFecha(e.salida)})`, e.id);
  return e;
}
function cancelarReserva(id) {
  const e = estadia(id);
  if (!e) throw new ErrNegocio('La reserva no existe.');
  if (e.estado !== 'reservada') throw new ErrNegocio('Solo se pueden cancelar reservas pendientes.');
  pagosDeEstadia(e.id).forEach(p => {
    const a = registrarAsiento({ concepto: `Devolución de anticipo ${p.id} (cancelación ${e.id})`, ref: e.id, refTipo: 'estadia', lineas: [{ cuenta: 'ANT', debe: p.importe }, { cuenta: MEDIOS[p.medio].cuenta, haber: p.importe }] });
    p.devuelto = true; p.asientoDevolucion = a.id;
  });
  e.estado = 'cancelada'; e.cancelada = ahora();
  bitacora(`Reserva ${e.id} cancelada`, e.id);
  return e;
}
/** Vista previa del cierre (no modifica datos). */
function previsualizarCierre(id, cobro) {
  const e = estadia(id);
  if (!e) return { ok: false, errores: ['La estadía no existe.'] };
  const errores = [];
  if (e.estado === 'cerrada') errores.push(`La estadía ya fue cerrada el ${fFechaHora(e.cierre.fecha)}. No se generan nuevos cargos, asientos ni liquidaciones.`);
  else if (e.estado !== 'activa') errores.push('Solo se puede cerrar una estadía activa.');
  const r = resumenEstadia(e);
  if (r.ticketsAbiertos.length) errores.push(`Hay ${r.ticketsAbiertos.length} ticket(s) gastronómico(s) abierto(s) asociado(s): ${r.ticketsAbiertos.map(t => t.id + ' (' + t.mesaId + ')').join(', ')}. Ciérrelos, páguelos o impútelos antes del check-out.`);
  const u = unidad(e.unidadId);
  const asientos = [];
  const cobroImp = cobro && cobro.importe > 0 ? cobro.importe : 0;
  if (cobroImp > r.saldo) errores.push('El cobro no puede superar el saldo pendiente.');
  if (cobroImp > 0) asientos.push({ concepto: `Cobro ${e.id} — ${MEDIOS[cobro.medio].nombre}`, lineas: [{ cuenta: MEDIOS[cobro.medio].cuenta, debe: cobroImp, haber: 0 }, { cuenta: 'CRED', debe: 0, haber: cobroImp }] });
  let liq = null;
  if (u.propietarioId) {
    const v = validarPorcentajes(u.pctProp, u.pctClub);
    if (!v.ok) errores.push('Liquidación: ' + v.motivo);
    if (S.liquidaciones.some(l => l.estadiaId === e.id)) errores.push('La estadía ya tiene una liquidación generada.');
    const base = e.calc.total, prop = pct(base, u.pctProp);
    liq = { propietario: propietario(u.propietarioId), base, pctProp: u.pctProp, pctClub: u.pctClub, importeProp: prop, importeClub: base - prop };
    asientos.push({ concepto: `Liquidación propietario ${e.id}`, lineas: [{ cuenta: 'ING_EST', debe: prop, haber: 0 }, { cuenta: 'PROP', debe: 0, haber: prop }] });
  }
  return { ok: errores.length === 0, errores, e, r, u, liq, asientos, saldoFinal: r.saldo - cobroImp };
}
/** Check-out y cierre de estancia: atómico e idempotente. */
function cerrarEstadia(id, opts = {}) {
  const e = estadia(id);
  if (!e) throw new ErrNegocio('La estadía no existe.');
  if (e.estado === 'cerrada') throw new ErrNegocio(`La estadía ${e.id} ya está cerrada. No se generan cargos, asientos ni liquidaciones adicionales.`, 'YA_CERRADA');
  const pv = previsualizarCierre(id, opts.cobro);
  if (!pv.ok) throw new ErrNegocio(pv.errores.join(' '));
  marcarOperacion('checkout:' + e.id);
  const asIds = [];
  let cobrado = 0;
  if (opts.cobro && opts.cobro.importe > 0) { const p = registrarPago(e.id, opts.cobro.importe, opts.cobro.medio, 'Cobro en check-out'); asIds.push(p.asientoId); cobrado = p.importe; }
  let liq = null;
  if (pv.u.propietarioId) { liq = liquidarEstadia(e); asIds.push(liq.asientoId); }
  const r = resumenEstadia(e);
  e.estado = 'cerrada';
  e.cierre = { fecha: ahora(), alojamiento: r.alojamiento, consumos: r.consumos, otros: r.otros, totalCargos: r.totalCargos, totalPagos: r.totalPagos, cobrado, saldo: r.saldo, pagosDirectos: r.pagosDirectos, liquidacionId: liq ? liq.id : null, asientos: asIds, mantenimiento: !!opts.mantenimiento };
  if (opts.mantenimiento) { pv.u.mantenimiento = true; pv.u.motivoMant = 'Limpieza y revisión posterior al check-out'; }
  bitacora(`Check-out ${e.id} (${e.unidadId}). Saldo final ${money(r.saldo)}`, e.id);
  return e;
}
function setMantenimiento(uid, on, motivo) {
  const u = unidad(uid);
  if (!u) throw new ErrNegocio('Unidad inexistente.');
  if (on) {
    const act = estadiaActivaDeUnidad(uid);
    if (act) throw new ErrNegocio(`No se puede enviar a mantenimiento: ${uid} tiene un huésped alojado (${act.id}).`);
    u.mantenimiento = true; u.motivoMant = limpiar(motivo || 'Mantenimiento general', 120);
  } else { u.mantenimiento = false; u.motivoMant = ''; }
  bitacora(`${uid} ${on ? 'enviada a' : 'liberada de'} mantenimiento`, uid);
  return u;
}

/* =====================================================================
   10. PUNTO DE VENTA GASTRONÓMICO
   ===================================================================== */
function abrirCuenta(mesaId, d = {}) {
  const m = mesa(mesaId);
  if (!m) throw new ErrNegocio('La mesa no existe.');
  const abierta = ticketAbiertoDeMesa(mesaId);
  if (abierta) throw new ErrNegocio(`${mesaId} ya tiene la cuenta ${abierta.id} abierta. No se permite una segunda cuenta en la misma unidad.`);
  const com = entero(d.comensales);
  if (!(com >= 1)) throw new ErrNegocio('Indique la cantidad de comensales.');
  if (com > m.capacidad + 2) throw new ErrNegocio(`${m.id} admite hasta ${m.capacidad + 2} comensales.`);
  let e = null;
  if (d.estadiaId) { e = estadia(d.estadiaId); if (!e || e.estado !== 'activa') throw new ErrNegocio('Solo se puede asociar a una estadía activa.'); }
  const t = {
    id: nextId('tic', 'T'), mesaId, area: m.area, estado: 'abierto', comensales: com, estadiaId: e ? e.id : null, clienteId: e ? e.clienteId : null,
    nombre: limpiar(d.nombre || (m.reserva ? m.reserva.nombre : ''), 60), lineas: [], abierto: ahora(), cierre: null, stockAplicado: false, origen: ORIGEN
  };
  const habiaReserva = !!m.reserva;
  m.reserva = null;
  S.tickets.push(t);
  bitacora(`Cuenta ${t.id} abierta en ${mesaId}${habiaReserva ? ' (reserva ocupada)' : ''}`, t.id);
  return t;
}
function ticketEditable(id) {
  const t = ticket(id);
  if (!t) throw new ErrNegocio('El ticket no existe.');
  if (t.estado !== 'abierto') throw new ErrNegocio(`El ticket ${t.id} ya está cerrado (${t.estado}). No se puede modificar.`);
  return t;
}
function agregarProducto(ticketId, prodId, cant = 1) {
  const t = ticketEditable(ticketId);
  const p = producto(prodId);
  if (!p) throw new ErrNegocio('Producto inexistente.');
  if (!p.activo) throw new ErrNegocio(`${p.nombre} está inactivo.`);
  const q = entero(cant);
  if (!(q >= 1 && q <= 99)) throw new ErrNegocio('Cantidad inválida.');
  let l = t.lineas.find(x => x.productoId === prodId && x.precio === p.precio);
  const nueva = (l ? l.cantidad : 0) + q;
  if (nueva > stockDisponible(prodId, l ? l.id : null)) throw new ErrNegocio(`Stock insuficiente de ${p.nombre}: disponible ${stockDisponible(prodId, l ? l.id : null)}.`);
  if (l) l.cantidad = nueva;
  else t.lineas.push({ id: nextId('lin', 'L', 5), productoId: p.id, nombre: p.nombre, precio: p.precio, costo: p.costo, cantidad: q });
  return t;
}
function setCantidad(ticketId, lineaId, cant) {
  const t = ticketEditable(ticketId);
  const l = t.lineas.find(x => x.id === lineaId);
  if (!l) throw new ErrNegocio('La línea no existe.');
  const q = entero(cant);
  if (!(q >= 0 && q <= 99)) throw new ErrNegocio('Cantidad inválida.');
  if (q === 0) { t.lineas = t.lineas.filter(x => x.id !== lineaId); return t; }
  if (q > stockDisponible(l.productoId, l.id)) throw new ErrNegocio(`Stock insuficiente: disponible ${stockDisponible(l.productoId, l.id)}.`);
  l.cantidad = q;
  return t;
}
function quitarLinea(ticketId, lineaId) { return setCantidad(ticketId, lineaId, 0); }
function asociarEstadiaTicket(ticketId, estadiaId) {
  const t = ticketEditable(ticketId);
  if (!estadiaId) { t.estadiaId = null; t.clienteId = null; return t; }
  const e = estadia(estadiaId);
  if (!e || e.estado !== 'activa') throw new ErrNegocio('Solo se puede asociar a una estadía activa (parcela ocupada).');
  t.estadiaId = e.id; t.clienteId = e.clienteId;
  return t;
}
/** Descuenta stock UNA sola vez por ticket, al confirmar la operación (pago o imputación). */
function aplicarStock(t) {
  if (t.stockAplicado) throw new ErrNegocio('El stock de este ticket ya fue descontado.', 'DUPLICADO');
  for (const l of t.lineas) {
    const p = producto(l.productoId);
    if (!p) throw new ErrNegocio(`Producto ${l.productoId} inexistente.`);
    const necesario = suma(t.lineas.filter(x => x.productoId === l.productoId), x => x.cantidad);
    if (p.stock < necesario) throw new ErrNegocio(`Stock insuficiente de ${p.nombre} (hay ${p.stock}, se necesitan ${necesario}).`);
  }
  t.lineas.forEach(l => { producto(l.productoId).stock -= l.cantidad; });
  t.stockAplicado = true;
}
/** Asiento D: consumo pagado directamente. No vuelve a cobrarse en el check-out. */
function pagarTicket(ticketId, medio) {
  const t = ticketEditable(ticketId);
  if (!t.lineas.length) throw new ErrNegocio('El ticket no tiene productos.');

function liquidarEstadia(e) {

/** Alta/edición de una unidad de terceros. Cualquier parcela o cabaña existente puede subalquilarse; las cabañas nuevas se crean ya subalquiladas. */

/* =====================================================================
   12. PILETA Y CANCHAS — cálculo, validaciones y operaciones
   Tres modalidades, una sola lógica de cobro:
   · Entrada individual de pileta (venta del día, por persona).
   · Alquiler de pileta (turno exclusivo, con seña opcional).
   · Alquiler de cancha (fútbol 5, fútbol 11, pádel; por hora, con seña opcional).
   Todo uso se cobra en caja/banco o se carga a la cuenta de una estadía activa
   (cargo cruzado). La seña se registra en «Anticipos de clientes» y se aplica al cobrar.
   ===================================================================== */
const instalacion = id => porId(S.instalaciones, id);
const uso = id => porId(S.usos, id);
const cuentaIngresoInst = i => i.clase === 'pileta' ? 'ING_PIL' : 'ING_CAN';
const usoCobrado = u => u.estado === 'cobrada' || u.estado === 'imputada';
const senaVigente = u => (u.sena && !u.sena.devuelta && !u.sena.aplicada) ? u.sena.importe : 0;
const senasPendientesUsos = () => suma(S.usos.filter(u => u.estado === 'reservada'), senaVigente);
const nombreUso = u => u.clienteId ? nombreCliente(cliente(u.clienteId)) : (u.nombre || 'Visitante');
const horaActual = () => ahora().slice(11, 16);
/** Personas que ya compraron entrada de pileta en el día (aforo). */
function aforoUsado(fecha) { return suma(S.usos.filter(u => u.inst === 'PIL' && u.tipo === 'entrada' && u.fecha === fecha && u.estado !== 'cancelada'), u => u.personas); }
/** Reservas con horario (canchas y alquiler de pileta) de una instalación en una fecha, ordenadas. */
function usosDe(iid, fecha) { return S.usos.filter(u => u.inst === iid && u.fecha === fecha && u.estado !== 'cancelada' && u.tipo !== 'entrada').sort((a, b) => a.desde.localeCompare(b.desde)); }
function haySolapeUso(iid, fecha, desde, hasta, exceptoId) {
  return usosDe(iid, fecha).find(u => u.id !== exceptoId && hm(u.desde) < hm(hasta) && hm(desde) < hm(u.hasta)) || null;
}
function estadoInst(i) {
  if (i.mantenimiento) return 'mantenimiento';
  const now = hm(horaActual());
  const hoyU = usosDe(i.id, hoy());
  if (hoyU.some(u => hm(u.desde) <= now && now < hm(u.hasta))) return 'ocupada';
  if (hoyU.some(u => hm(u.desde) > now)) return 'reservada';
  return 'libre';
}

/**
 * Cálculo centralizado de pileta y canchas (única fuente de verdad para importes).
 * Entrada: adultos/menores (+ recargo de temporada alta).
 * Alquiler de pileta: turno + personas adicionales (+ temporada alta).
 * Cancha: horas × precio (+ recargo nocturno por iluminación). Descuento de socio una sola vez.
 */
function calcularUso(p, cfg) {
  cfg = cfg || S.config;
  const I = cfg.inst, errores = [];
  const ins = p.inst ? instalacion(p.inst) : null;
  if (!ins) return { ok: false, errores: ['Seleccione una instalación.'] };
  if (!esFechaISO(p.fecha)) errores.push('Ingrese una fecha válida.');
  const c = p.cliente || (p.clienteId ? cliente(p.clienteId) : null);
  const temp = esFechaISO(p.fecha) ? temporadaDe(p.fecha, cfg) : null;
  const tipo = ins.clase === 'pileta' ? (p.tipo === 'alquiler' ? 'alquiler' : 'entrada') : 'cancha';
  const lineas = [];
  let personas = 0, adultos = 0, menores = 0, horas = 0, desde = '', hasta = '', turno = null;
  const detalleHoras = [];
  if (tipo === 'entrada') {
    const P = I.pileta;
    adultos = entero(p.adultos ?? 0); menores = entero(p.menores ?? 0);
    if (!(adultos >= 0) || !(menores >= 0)) errores.push('Ingrese cantidades válidas de adultos y menores.');
    else if (adultos + menores < 1) errores.push('Registre al menos una persona.');
    else {
      personas = adultos + menores;
      if (adultos > 0) lineas.push({ txt: `Entrada adulto (${adultos} × ${money(P.entradaAdulto)})`, imp: adultos * P.entradaAdulto });
      if (menores > 0) lineas.push({ txt: `Entrada menor de hasta ${P.edadMenor} años (${menores} × ${money(P.entradaMenor)})`, imp: menores * P.entradaMenor });
      if (temp) lineas.push({ txt: `Recargo por temporada alta (${P.recargoAlta} %)`, imp: pct(suma(lineas, l => l.imp), P.recargoAlta) });
    }
  } else if (tipo === 'alquiler') {
    const P = I.pileta;
    turno = P.turnos.find(t => t.id === p.turno) || null;
    if (!turno) errores.push('Seleccione el turno de alquiler.'); else { desde = turno.desde; hasta = turno.hasta; }
    personas = entero(p.personas ?? 0);
    if (!(personas >= 1)) errores.push('Indique la cantidad de personas.');
    else if (personas > P.aforoAlquiler) errores.push(`El alquiler admite hasta ${P.aforoAlquiler} personas.`);
    if (turno && personas >= 1) {
      lineas.push({ txt: `Alquiler de pileta · ${turno.nombre.toLowerCase()} ${turno.desde}–${turno.hasta}`, imp: P.alquilerTurno });
      const extra = Math.max(0, personas - P.personasIncl);
      if (extra) lineas.push({ txt: `Personas adicionales (${extra} × ${money(P.extraPersona)}; incluidas ${P.personasIncl})`, imp: extra * P.extraPersona });
      if (temp) lineas.push({ txt: `Recargo por temporada alta (${P.recargoAlta} %)`, imp: pct(suma(lineas, l => l.imp), P.recargoAlta) });
    }
  } else {
    const C = I.canchas[ins.clase];
    desde = p.desde; horas = entero(p.horas);
    if (!esHora(desde)) errores.push('Seleccione la hora de inicio.');
    else if (hm(desde) % 60 !== 0) errores.push('El horario de inicio debe ser en punto.');
    if (!(horas >= 1 && horas <= C.maxHoras)) errores.push(`La duración debe ser de 1 a ${C.maxHoras} hora(s).`);
    if (esHora(desde) && horas >= 1 && horas <= C.maxHoras) {
      hasta = deMin(hm(desde) + horas * 60);
      if (hm(desde) < hm(I.apertura) || hm(hasta) > hm(I.cierre)) errores.push(`Las canchas funcionan de ${I.apertura} a ${I.cierre}.`);
      for (let m = hm(desde); m < hm(desde) + horas * 60; m += 60) {
        const noct = m >= hm(I.nocturnoDesde);
        detalleHoras.push({ hora: deMin(m), noct, base: C.precioHora, rec: noct ? pct(C.precioHora, I.recargoNocturno) : 0 });
      }
      lineas.push({ txt: `${ins.nombre} (${horas} h × ${money(C.precioHora)})`, imp: horas * C.precioHora });
      const nn = detalleHoras.filter(d => d.noct).length;
      if (nn) lineas.push({ txt: `Recargo nocturno por iluminación (${nn} h × ${I.recargoNocturno} %)`, imp: suma(detalleHoras, d => d.rec) });
    }
  }
  if (errores.length) return { ok: false, errores };
  const subtotal = suma(lineas, l => l.imp);
  const eleg = c ? elegibilidadSocio(c) : { ok: false, motivo: 'Visitante sin socio registrado' };

/* ---------- Toasts ---------- */
function toast(msg, tipo = 'ok', titulo) {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (tipo === 'ok' ? '' : tipo);
  const t = titulo || { ok: 'Listo', warn: 'Atención', error: 'No se pudo completar', info: 'Información' }[tipo] || '';
  el.innerHTML = `<b>${esc(t)}</b>${esc(msg)}`;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, tipo === 'error' ? 7000 : 4200);
  while (box.children.length > 4) box.firstChild.remove();
}
/** Ejecuta una operación de negocio de forma atómica, persiste y refresca la UI. */
function ejecutar(fn, okMsg) {
  try {
    const r = transaccion(fn);
    guardar();
    render();
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r) : okMsg, 'ok');
    return r;
  } catch (e) {
    if (e instanceof ErrNegocio) toast(e.message, e.code === 'DUPLICADO' || e.code === 'YA_CERRADA' ? 'warn' : 'error');
    else { console.error(e); toast('Error inesperado: ' + e.message, 'error'); }
    render();
    return null;
  }
}

const PLANES = { 'Socio titular': 'titular', 'Socio familiar': 'familiar' };
function solicitud(id) { return S.solicitudes.find(x => x.id === id); }
function validarSolicitud(d) {
  const errs = [];
  if (!limpiar(d.nombre)) errs.push('Ingrese su nombre.');
  if (!limpiar(d.apellido)) errs.push('Ingrese su apellido.');
  const doc = String(d.doc || '').replace(/\D/g, '');
  if (doc.length < 7 || doc.length > 11) errs.push('El documento debe tener entre 7 y 11 dígitos.');
  if (!/^[+\d\s()-]{6,25}$/.test(String(d.tel || ''))) errs.push('Ingrese un teléfono válido.');
  if (d.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(d.email))) errs.push('El correo electrónico no es válido.');
  if (!PLANES[d.categoria]) errs.push('Elija un tipo de membresía.');
  if (d.categoria === 'Socio familiar') { const n = entero(d.integrantes); if (!(n >= 2 && n <= 10)) errs.push('Indique la cantidad de integrantes (entre 2 y 10).'); }
  if (!d.acepta) errs.push('Debe aceptar que el club se comunique con usted para completar el alta.');
  if (!errs.length) {
    const cli = S.clientes.find(c => c.doc.replace(/\D/g, '') === doc);
    if (cli && cli.esSocio && cli.estadoSocio === 'Activo') errs.push('Ese documento ya pertenece a un socio activo.');
    if (S.solicitudes.some(x => x.estado === 'pendiente' && x.doc.replace(/\D/g, '') === doc)) errs.push('Ya hay una solicitud pendiente con ese documento.');
  }
  return errs;
}
function crearSolicitud(d) {
  const errs = validarSolicitud(d);
  if (errs.length) throw new ErrNegocio(errs.join(' '));
  const sol = {
    id: nextId('sol', 'SOL', 3), fecha: hoy(), nombre: limpiar(d.nombre, 40), apellido: limpiar(d.apellido, 40), doc: limpiar(d.doc, 14), tel: limpiar(d.tel, 25),
    email: limpiar(d.email, 60), categoria: d.categoria, integrantes: d.categoria === 'Socio familiar' ? entero(d.integrantes) : 1,
    mensaje: limpiar(d.mensaje, 240), estado: 'pendiente', origen: ORIGEN
  };
  S.solicitudes.unshift(sol);
  bitacora(`Solicitud de asociación ${sol.id}: ${sol.nombre} ${sol.apellido} (${sol.categoria})`, sol.id);
  return sol;
}
function resolverSolicitud(id, aprobar) {
  const sol = solicitud(id);
  if (!sol) throw new ErrNegocio('Solicitud inexistente.');
  if (sol.estado !== 'pendiente') throw new ErrNegocio('La solicitud ya fue resuelta.', 'YA_CERRADA');
  if (!aprobar) { sol.estado = 'rechazada'; sol.resuelta = hoy(); bitacora(`Solicitud ${id} rechazada`, id); return sol; }
  const doc = sol.doc.replace(/\D/g, '');
  let c = S.clientes.find(x => x.doc.replace(/\D/g, '') === doc);
  const vence = sumarDias(hoy(), 30);
  if (c) { Object.assign(c, { esSocio: true, estadoSocio: 'Activo', categoria: sol.categoria, cuotaVence: vence }); }
  else c = crearCliente({ nombre: sol.nombre, apellido: sol.apellido, doc: sol.doc, tel: sol.tel, email: sol.email, categoria: sol.categoria, esSocio: true, estadoSocio: 'Activo', cuotaVence: vence });
  sol.estado = 'aprobada'; sol.resuelta = hoy(); sol.clienteId = c.id;
  bitacora(`Solicitud ${id} aprobada: ${nombreCliente(c)} es socio (${c.id})`, id);
  return { sol, c };
}
function guardarMembresia(d) {
  const errs = [], M = S.config.membresia;
  const imp = (k, et) => { const v = aCentavos(d[k]); if (!(v >= 0)) errs.push(`${et}: importe inválido.`); return v; };
  const tc = imp('m_tc', 'Cuota de socio titular'), ti = imp('m_ti', 'Ingreso de socio titular'), fc = imp('m_fc', 'Cuota de socio familiar'), fi = imp('m_fi', 'Ingreso de socio familiar');
  if (!(tc > 0) || !(fc > 0)) errs.push('Las cuotas mensuales deben ser mayores a cero.');
  if (d.m_email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(d.m_email))) errs.push('El correo de contacto no es válido.');
  if (errs.length) throw new ErrNegocio(errs.join(' '));
  M.titular.cuota = tc; M.titular.ingreso = ti; M.familiar.cuota = fc; M.familiar.ingreso = fi;
  M.bienvenida = limpiar(d.m_bienvenida, 240); M.contacto = limpiar(d.m_contacto, 80); M.whatsapp = limpiar(d.m_whatsapp, 25); M.email = limpiar(d.m_email, 60);
  bitacora('Membresías y datos del sitio público actualizados', 'config');
}

const TEMA = { clave: 'svb_camping_tema', actual: 'dark' };
function temaInicial() {
  let t = null;
  try { t = localStorage.getItem(TEMA.clave); } catch (e) { t = null; }
  if (t !== 'light' && t !== 'dark') { try { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { t = 'dark'; } }
  return t;
}
function aplicarTema(t) {
  TEMA.actual = t === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', TEMA.actual);
  document.querySelectorAll('[data-tema-btn]').forEach(b => { b.textContent = TEMA.actual === 'light' ? '☾ Oscuro' : '☀ Claro'; });
}
function alternarTema() {
  aplicarTema(TEMA.actual === 'light' ? 'dark' : 'light');
  try { localStorage.setItem(TEMA.clave, TEMA.actual); } catch (e) { /* sin almacenamiento: queda solo en esta sesión */ }
}

        <div class="row"><button class="btn ghost sm" type="button" data-a="pagoEstadia" data-v="${e.id}">Registrar pago</button><button class="btn ghost sm" type="button" data-a="verEstadia" data-v="${e.id}">Ver cuenta completa</button><button class="btn ghost sm" type="button" data-a="go" data-v="gastro">Ir a gastronomía</button></div>
      </div></div>`;
  }
  const prox = proximaReservaDeUnidad(u.id);
  const resHtml = prox ? `<div class="notice ${st === 'reservada' ? 'warn' : 'info'}">Próxima reserva <b>${prox.id}</b>: ${esc(nombreCliente(cliente(prox.clienteId)))} · ${fFecha(prox.ingreso)} → ${fFecha(prox.salida)} · anticipo ${money(resumenEstadia(prox).anticipos)}
      <div class="row mt"><button class="btn sm" type="button" data-a="verEstadia" data-v="${prox.id}">Ver reserva</button>${prox.ingreso <= hoy() ? `<button class="btn sm" type="button" data-a="checkinReserva" data-v="${prox.id}">Registrar check-in</button>` : ''}</div></div>` : '';
  if (st === 'mantenimiento') {
    return `<div class="card detail">${head}<dl><dt>Código</dt><dd><b>${esc(u.id)}</b></dd><dt>Motivo</dt><dd>${esc(u.motivoMant || '—')}</dd></dl>
      <div class="notice warn mt">Unidad en mantenimiento: no admite check-in ni reservas hasta finalizarlo.</div>${resHtml}
      <button class="btn block" type="button" data-a="finMant" data-v="${u.id}">Finalizar mantenimiento</button>
      <button class="btn ghost sm block mt" type="button" data-a="subalquilarUnidad" data-v="${u.id}">${u.propietarioId ? 'Editar subalquiler' : 'Subalquilar esta unidad'}</button></div>`;
  }
  const tarifa = u.tarifa ? money(u.tarifa) + ' / noche' : 'Según tipo de alojamiento';
  return `<div class="card detail">${head}<dl><dt>Código</dt><dd><b>${esc(u.id)}</b></dd><dt>Capacidad</dt><dd>${u.maxPers} personas · ${u.maxVeh} vehículos</dd><dt>Tarifa</dt><dd>${tarifa}</dd></dl>
    <div class="mt">${resHtml}</div>
    <div class="col">
      <button class="btn big block" type="button" data-a="checkinRapido" data-v="${u.id}">Check-in rápido</button>
      <div class="row"><button class="btn ghost sm" type="button" data-a="nuevaReserva" data-v="${u.id}">Nueva reserva</button><button class="btn ghost sm" type="button" data-a="iniMant" data-v="${u.id}">Enviar a mantenimiento</button></div>
      <button class="btn ghost sm block" type="button" data-a="subalquilarUnidad" data-v="${u.id}">${u.propietarioId ? 'Editar subalquiler' : 'Subalquilar esta unidad'}</button>
    </div></div>`;
}

/* =====================================================================
   8. RESERVAS Y ESTADÍAS (vista, formularios, check-out)
   ===================================================================== */
VISTAS.estadias = () => {
  const f = UI.f, q = f.estQ.toLowerCase();
  const filtroEstado = { vigentes: ['reservada', 'activa'], activas: ['activa'], reservadas: ['reservada'], cerradas: ['cerrada'], canceladas: ['cancelada'], todas: ['reservada', 'activa', 'cerrada', 'cancelada'] }[f.estEstado] || ['reservada', 'activa'];
  const lista = S.estadias.filter(e => filtroEstado.includes(e.estado) && (!q || `${e.id} ${e.unidadId} ${nombreCliente(cliente(e.clienteId))}`.toLowerCase().includes(q)))
    .sort((a, b) => ({ activa: 0, reservada: 1, cerrada: 2, cancelada: 3 }[a.estado] - { activa: 0, reservada: 1, cerrada: 2, cancelada: 3 }[b.estado]) || a.ingreso.localeCompare(b.ingreso));
  const tot = lista.filter(e => e.estado !== 'cancelada').map(resumenEstadia);
  return `
  <div class="filters">
    <div class="field" style="flex:1;min-width:200px"><label for="fEstQ">Buscar</label><input id="fEstQ" data-f="estQ" value="${esc(f.estQ)}" placeholder="Estadía, unidad o huésped"></div>
    <div class="field"><label for="fEstE">Estado</label><select id="fEstE" data-f="estEstado">${opciones([['vigentes', 'Vigentes (activas y reservas)'], ['activas', 'Activas'], ['reservadas', 'Reservas pendientes'], ['cerradas', 'Cerradas'], ['canceladas', 'Canceladas'], ['todas', 'Todas']], f.estEstado)}</select></div>
    <button class="btn" type="button" data-a="nuevaReservaGlobal">+ Nueva reserva</button>
  </div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>Estadía</th><th>Unidad</th><th>Huésped</th><th>Ingreso</th><th>Salida</th><th class="num">Noches</th><th class="num">Pers.</th><th>Estado</th><th class="num">Alojamiento</th><th class="num">Consumos</th><th class="num">Pagos</th><th class="num">Saldo</th><th></th></tr></thead>
    <tbody>${lista.map(e => { const r = resumenEstadia(e); const c = cliente(e.clienteId); return `<tr class="click" data-a="verEstadia" data-v="${e.id}">
      <td class="mono">${e.id}</td><td><b>${e.unidadId}</b></td><td>${esc(nombreCliente(c))}${e.calc.descuento ? ' <span class="pill ok tiny">socio</span>' : ''}</td><td>${fFecha(e.ingreso)}</td><td>${fFecha(e.salida)}</td>
      <td class="num">${e.calc.noches}</td><td class="num">${e.personas}</td><td>${pillEstadia(e.estado)}</td>
      <td class="num">${money(r.alojamiento)}</td><td class="num">${money(r.consumos)}</td><td class="num">${money(r.totalPagos)}</td><td class="num"><b>${e.estado === 'cancelada' ? '—' : money(r.saldo)}</b></td>
      <td>${e.estado === 'activa' ? `<button class="btn warnb xs" type="button" data-a="checkout" data-v="${e.id}">Check-out</button>` : e.estado === 'reservada' && e.ingreso <= hoy() ? `<button class="btn xs" type="button" data-a="checkinReserva" data-v="${e.id}">Check-in</button>` : ''}</td></tr>`; }).join('') || `<tr><td colspan="13">${vacio('No hay estadías con este filtro', 'Cambie el filtro o registre una nueva reserva.')}</td></tr>`}</tbody>
    ${tot.length ? `<tfoot><tr><td colspan="8">Totales (${tot.length})</td><td class="num">${money(suma(tot, r => r.alojamiento))}</td><td class="num">${money(suma(tot, r => r.consumos))}</td><td class="num">${money(suma(tot, r => r.totalPagos))}</td><td class="num">${money(suma(tot, r => r.saldo))}</td><td></td></tr></tfoot>` : ''}
  </table></div></div>
  <p class="sub small mt">La estadía se devenga contablemente al registrar el check-in. Las reservas pendientes sólo registran anticipos (pasivo «Anticipos de clientes») hasta el ingreso.</p>`;
};

/** Formulario de check-in rápido / nueva reserva / modificación de reserva. */
function modalEstadia({ unidadId, clienteId, modo, estadiaId }) {
  const e = estadiaId ? estadia(estadiaId) : null;
  const esMod = !!e;
  const ingreso0 = e ? e.ingreso : (modo === 'checkin' ? hoy() : sumarDias(hoy(), 1));
  const salida0 = e ? e.salida : sumarDias(ingreso0, 2);
  const uSel = e ? e.unidadId : unidadId || '';
  const unidadesOpc = S.unidades.filter(u => !u.mantenimiento || u.id === uSel).map(u => [u.id, `${u.id} · ${u.nombre} (${ESTADO_UNIDAD_TXT[estadoUnidad(u)]})`]);
  const cliOpc = S.clientes.map(c => { const el = elegibilidadSocio(c); return [c.id, `${nombreCliente(c)} — ${el.ok ? 'socio activo ✓ descuento' : c.esSocio ? (el.vencida ? 'socio · cuota vencida' : 'socio ' + c.estadoSocio.toLowerCase()) : 'no socio'}`]; });
  const titulo = esMod ? `Modificar reserva ${e.id}` : modo === 'checkin' ? `Check-in rápido${uSel ? ' · ' + uSel : ''}` : `Nueva reserva${uSel ? ' · ' + uSel : ''}`;
  abrirModal({
    titulo, ancho: 'wide',
    cuerpo: `<form id="fEst" novalidate><div class="grid12">
      <div class="s7">
        <div id="errEst"></div>
        <div class="g2">
          <div class="field"><label>Unidad *</label><select name="unidadId" ${esMod ? 'disabled' : ''}><option value="">Seleccione…</option>${opciones(unidadesOpc, uSel)}</select></div>
          <div class="field"><label>Tipo de alojamiento *</label><select name="tipo">${opciones(Object.entries(S.config.tipos).map(([k, t]) => [k, t.nombre]), e ? e.tipo : 'carpa')}</select></div>
        </div>
        ${esMod ? `<div class="field"><label>Cliente</label><input value="${esc(nombreCliente(cliente(e.clienteId)))}" disabled></div>` : `
        <div class="seg" role="radiogroup" aria-label="Cliente"><label><input type="radio" name="modoCli" value="existente" checked> Cliente existente</label><label><input type="radio" name="modoCli" value="nuevo"> Nuevo cliente</label></div>
        <div data-cli="existente"><div class="field"><label>Socio o cliente *</label><select name="clienteId"><option value="">Seleccione…</option>${opciones(cliOpc, clienteId || '')}</select></div></div>
        <div data-cli="nuevo" class="card" style="display:none;padding:14px">${camposCliente({ esSocio: false, categoria: 'Cliente externo' }, 'n_')}</div>`}
        <div class="g2 mt">
          <div class="field"><label>Fecha de ingreso *</label><input type="date" name="ingreso" value="${ingreso0}" min="${hoy()}"></div>
          <div class="field"><label>Fecha de salida *</label><input type="date" name="salida" value="${salida0}" min="${sumarDias(hoy(), 1)}"></div>
          <div class="field"><label>Personas *</label><input type="number" name="personas" min="1" max="12" step="1" value="${e ? e.personas : 2}"></div>
          <div class="field"><label>Vehículos</label><input type="number" name="vehiculos" min="0" max="4" step="1" value="${e ? e.vehiculos : 1}"></div>
        </div>
        <div class="field"><label>Patentes de vehículos</label><input name="patentes" maxlength="80" value="${esc(e ? e.patentes : '')}" placeholder="AA123BB, AC456DD (ficticias)"></div>
        ${esMod ? '' : `<div class="g2"><div class="field"><label>Pago / anticipo inicial (ARS)</label><input name="pagoImporte" inputmode="decimal" placeholder="0,00"></div>
          <div class="field"><label>Medio</label><select name="pagoMedio">${opciones(Object.entries(MEDIOS).map(([k, m]) => [k, m.nombre]), 'efectivo')}</select></div></div>`}
        <div class="field"><label>Notas</label><input name="notas" maxlength="200" value="${esc(e ? e.notas : '')}"></div>
      </div>
      <div class="s5"><div class="card" style="background:var(--panel2)"><h3>Cálculo automático</h3><div id="prevEst"></div></div></div>
    </div></form>`,
    pie: `<button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn" type="submit" form="fEst" id="btnEst">Confirmar</button>`,
    onBind: d => {
      const f = d.querySelector('#fEst');
      if (!esMod) bindSocioToggle(f, 'n_');
      const leer = () => {
        const fd = formData(f);
        const nuevo = !esMod && fd.modoCli === 'nuevo';
        const imp = fd.pagoImporte ? aCentavos(fd.pagoImporte) : 0;
        return {
          nuevo, cli: nuevo ? leerCliente(fd, 'n_') : null,
          datos: { unidadId: esMod ? e.unidadId : fd.unidadId, clienteId: esMod ? e.clienteId : fd.clienteId, tipo: fd.tipo, ingreso: fd.ingreso, salida: fd.salida, personas: fd.personas, vehiculos: fd.vehiculos, patentes: fd.patentes, notas: fd.notas, pagoInicial: imp ? { importe: imp, medio: fd.pagoMedio } : null },
          impInvalido: fd.pagoImporte && !(imp > 0)
        };
      };
      const actualizar = () => {
        const { nuevo, cli, datos, impInvalido } = leer();
        if (!esMod) d.querySelectorAll('[data-cli]').forEach(x => { x.style.display = x.dataset.cli === (nuevo ? 'nuevo' : 'existente') ? '' : 'none'; });
        const u = unidad(datos.unidadId);
        const tipoSel = f.querySelector('[name=tipo]');
        if (u && u.tipoFijo) { tipoSel.value = u.tipoFijo; tipoSel.disabled = true; datos.tipo = u.tipoFijo; } else { tipoSel.disabled = false; if (tipoSel.value === 'cabana' && u) { tipoSel.value = 'carpa'; datos.tipo = 'carpa'; } }
        const cliObj = nuevo ? { ...cli, esSocio: cli.esSocio, estadoSocio: cli.esSocio ? cli.estadoSocio : 'No socio' } : null;
        const calc = calcularAlojamiento(nuevo ? { ...datos, cliente: cliObj } : datos);
        let errs = validarEstadia(nuevo ? { ...datos, clienteId: '__nuevo__' } : datos, esMod ? e.id : undefined).filter(x => !(nuevo && x.startsWith('Seleccione o registre')));
        if (impInvalido) errs.push('El importe del pago inicial no es válido.');
        const esCheckin = esFechaISO(datos.ingreso) && datos.ingreso <= hoy();
        const btn = d.querySelector('#btnEst');
        btn.textContent = esMod ? 'Guardar cambios' : esCheckin ? 'Confirmar check-in y asignar unidad' : 'Confirmar reserva';
        let h = '';
        const c = nuevo ? cliObj : cliente(datos.clienteId);
        if (c) { const el = elegibilidadSocio(c); h += el.ok ? `<div class="notice ok">${esc(nombreCliente(c))}: socio activo con cuotas al día → descuento ${S.config.descSocio} %.</div>` : el.vencida ? `<div class="notice warn">⚠ ${esc(nombreCliente(c))} tiene cuotas vencidas (${fFecha(c.cuotaVence)}). No se aplica el beneficio de socio.</div>` : `<div class="notice info">${esc(el.motivo)}: sin descuento.</div>`; }
        if (u && u.propietarioId) h += `<div class="notice info">Cabaña de tercero: al cerrar se liquidará ${u.pctProp} % al propietario.</div>`;
        if (errs.length) h += `<div class="errors"><ul>${errs.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
        h += calc.ok ? tablaCalculo(calc) : '<p class="sub small">Complete los datos para calcular el precio.</p>';
        if (calc.ok && !esMod) h += `<p class="sub small mt">${esCheckin ? 'Se registrará el check-in, se ocupará la unidad y se devengará la estadía.' : 'Se registrará como reserva; el alojamiento se devenga al hacer el check-in.'}</p>`;
        d.querySelector('#prevEst').innerHTML = h;
        btn.disabled = errs.length > 0 || !calc.ok;
        return { errs };
      };
      f.addEventListener('input', actualizar);
      f.addEventListener('change', actualizar);
      actualizar();
      f.addEventListener('submit', ev => {
        ev.preventDefault();
        const { nuevo, cli, datos, impInvalido } = leer();
        if (impInvalido) return mostrarErrores(d.querySelector('#errEst'), ['El importe del pago inicial no es válido.']);
        if (nuevo) { const ce = validarCliente(cli); if (ce.length) return mostrarErrores(d.querySelector('#errEst'), ce); }
        const btn = d.querySelector('#btnEst'); btn.disabled = true;
        const r = ejecutar(() => {
          if (esMod) return modificarReserva(e.id, datos);
          if (nuevo) { const c = crearCliente(cli); datos.clienteId = c.id; }
          return crearEstadia(datos);
        }, x => esMod ? `Reserva ${x.id} actualizada. Nuevo total ${money(x.calc.total)}.` : x.estado === 'activa' ? `Check-in registrado: ${x.id} en ${x.unidadId}. Total alojamiento ${money(x.calc.total)}.` : `Reserva ${x.id} registrada para ${x.unidadId}.`);
        if (r) { cerrarModal(); if (r.estado === 'activa') UI.selUnidad = r.unidadId; render(); }
        else { btn.disabled = false; actualizar(); }
      });
    }
  });
}

function modalVerEstadia(id) {
  const e = estadia(id); if (!e) return;
  const pintar = () => {
    const e2 = estadia(id), r = resumenEstadia(e2), c = cliente(e2.clienteId), u = unidad(e2.unidadId);
    const liq = S.liquidaciones.find(l => l.estadiaId === e2.id);
    return `<div class="grid12">
      <div class="card s5 detail"><h3>Datos de la estadía ${pillEstadia(e2.estado)}</h3><dl>
        <dt>Estadía</dt><dd class="mono">${e2.id}</dd><dt>Unidad</dt><dd><b>${e2.unidadId}</b> · ${esc(u.nombre)}</dd>
        <dt>Huésped</dt><dd>${esc(nombreCliente(c))}</dd><dt>Documento</dt><dd>${esc(c.doc)} (ficticio)</dd>
        <dt>Ingreso → salida</dt><dd>${fFecha(e2.ingreso)} → ${fFecha(e2.salida)}</dd><dt>Noches</dt><dd>${e2.calc.noches}</dd>
        <dt>Personas / vehículos</dt><dd>${e2.personas} / ${e2.vehiculos}</dd><dt>Patentes</dt><dd>${esc(e2.patentes || '—')}</dd>
        <dt>Tipo</dt><dd>${esc(e2.calc.tipoNombre)}</dd><dt>Creada</dt><dd>${fFechaHora(e2.creada)}</dd>
        <dt>Check-in</dt><dd>${fFechaHora(e2.checkin)}</dd><dt>Cierre</dt><dd>${e2.cierre ? fFechaHora(e2.cierre.fecha) : '—'}</dd>
        <dt>Origen</dt><dd>${pillOrigen(e2.origen)}</dd></dl>
        ${e2.notas ? `<p class="sub small mt">${esc(e2.notas)}</p>` : ''}
        ${liq ? `<div class="notice info mt">Liquidación ${liq.id}: propietario ${money(liq.importeProp)} · club ${money(liq.importeClub)} · ${esc(liq.estado)}</div>` : ''}
        ${r.ticketsAbiertos.length ? `<div class="notice warn mt">Tickets abiertos asociados: ${r.ticketsAbiertos.map(t => t.id + ' (' + t.mesaId + ')').join(', ')}</div>` : ''}
      </div>
      <div class="card s7"><h3>Detalle económico ${e2.estado === 'reservada' ? '<span class="pill warn">a devengar en el check-in</span>' : ''}</h3>${tablaCalculo(e2.calc, r)}
        ${r.pagosDirectos ? `<p class="sub small mt">Consumos pagados directamente en gastronomía (informativo, no se suman ni descuentan): ${money(r.pagosDirectos)}.</p>` : ''}
      </div>
      <div class="card s6"><h3>Cargos imputados</h3>${r.cargos.length ? `<div class="tw"><table><thead><tr><th>Cargo</th><th>Operación</th><th>Fecha</th><th>Concepto</th><th class="num">Importe</th></tr></thead><tbody>${r.cargos.map(x => `<tr><td class="mono">${x.id}</td><td class="mono">${x.op}</td><td>${fFechaHora(x.fecha)}</td><td>${esc(x.concepto)}</td><td class="num">${money(x.importe)}</td></tr>`).join('')}</tbody></table></div>` : vacio('Sin consumos imputados')}</div>
      <div class="card s6"><h3>Pagos imputados</h3>${S.pagos.filter(p => p.estadiaId === e2.id).length ? `<div class="tw"><table><thead><tr><th>Pago</th><th>Fecha</th><th>Tipo</th><th>Medio</th><th class="num">Importe</th></tr></thead><tbody>${S.pagos.filter(p => p.estadiaId === e2.id).map(p => `<tr><td class="mono">${p.id}</td><td>${fFechaHora(p.fecha)}</td><td>${p.tipo === 'anticipo' ? `Anticipo ${p.devuelto ? '<span class="pill bad">devuelto</span>' : p.aplicado ? '<span class="pill ok">aplicado</span>' : '<span class="pill warn">sin aplicar</span>'}` : 'Pago'}</td><td>${MEDIOS[p.medio].nombre}</td><td class="num">${money(p.importe)}</td></tr>`).join('')}</tbody></table></div>` : vacio('Sin pagos registrados')}</div>
    </div>`;
  };
  const pie = () => {
    const e2 = estadia(id);
    const b = ['<button class="btn ghost" type="button" data-close>Cerrar</button>'];
    if (e2.estado === 'reservada') {
      b.unshift(`<button class="btn danger left" type="button" data-a="cancelarReserva" data-v="${e2.id}">Cancelar reserva</button>`);
      b.push(`<button class="btn ghost" type="button" data-a="modificarReserva" data-v="${e2.id}">Modificar</button>`, `<button class="btn ghost" type="button" data-a="pagoEstadia" data-v="${e2.id}">Registrar anticipo</button>`);
      if (e2.ingreso <= hoy()) b.push(`<button class="btn" type="button" data-a="checkinReserva" data-v="${e2.id}">Registrar check-in</button>`);
    }
    if (e2.estado === 'activa') b.push(`<button class="btn ghost" type="button" data-a="pagoEstadia" data-v="${e2.id}">Registrar pago</button>`, `<button class="btn warnb" type="button" data-a="checkout" data-v="${e2.id}">Ejecutar Check-Out y Cierre de Estancia</button>`);
    if (e2.estado === 'cerrada') { if (resumenEstadia(e2).saldo > 0) b.push(`<button class="btn ghost" type="button" data-a="pagoEstadia" data-v="${e2.id}">Cobrar saldo</button>`); b.push(`<button class="btn" type="button" data-a="comprobante" data-v="${e2.id}">Ver comprobante</button>`); }
    return b.join('');
  };
  abrirModal({ titulo: `Estadía ${e.id} · ${e.unidadId}`, ancho: 'wide', cuerpo: pintar(), pie: pie() });
  MODAL.refresh = () => { const d = $('#dlg'); if (!estadia(id)) return; d.querySelector('.dlg-b').innerHTML = pintar(); d.querySelector('.dlg-f').innerHTML = pie(); };
}

function modalPago(id) {
  const e = estadia(id); if (!e) return;
  const r = resumenEstadia(e);
  const esAnt = e.estado === 'reservada';
  if (r.saldo <= 0) return toast('La estadía no tiene saldo pendiente.', 'info');
  abrirModal({
    titulo: `${esAnt ? 'Registrar anticipo' : 'Registrar pago'} · ${e.id}`, ancho: 'narrow',
    cuerpo: `<form id="fPago" novalidate><div id="errPago"></div>
      <div class="detail mb"><dl><dt>Huésped</dt><dd>${esc(nombreCliente(cliente(e.clienteId)))}</dd><dt>Total de cargos</dt><dd>${money(r.totalCargos)}</dd><dt>Pagos registrados</dt><dd>${money(r.totalPagos)}</dd><dt>Saldo pendiente</dt><dd class="big">${money(r.saldo)}</dd></dl></div>
      <div class="field"><label>Importe (ARS) *</label><input name="importe" inputmode="decimal" value="${aPesosInput(r.saldo).replace('.', ',')}"></div>
      <div class="field"><label>Medio de pago *</label><select name="medio">${opciones(Object.entries(MEDIOS).map(([k, m]) => [k, m.nombre]), 'efectivo')}</select></div>
      <p class="sub small">${esAnt ? 'Asiento E: Debe Caja/Banco · Haber Anticipos de clientes. Se aplicará a la deuda al hacer el check-in.' : 'Asiento C: Debe Caja/Banco · Haber Créditos por cobrar a huéspedes.'}</p></form>`,
    pie: `<button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn" type="submit" form="fPago">Registrar</button>`,
    onBind: d => {

        const fd = formData(f), imp = aCentavos(fd.importe);

/* ---------- Check-out ---------- */
function modalCheckout(id) {
  const e = estadia(id); if (!e) return;

  if (e.estado !== 'activa') return toast('Solo se puede ejecutar el check-out de una estadía activa.', 'error');
  const r0 = resumenEstadia(e);
  abrirModal({
    titulo: `Revisión de check-out · ${e.id} (${e.unidadId})`, ancho: 'wide',
    cuerpo: `<form id="fCo" novalidate><div id="coBody"></div>
      <div class="card mt" style="background:var(--panel2)"><h3>Cobro del saldo y estado de la unidad</h3>
      <div class="g3"><div class="field"><label>Saldo pendiente</label><select name="modo">${opciones([['cobrar', 'Cobrar ahora'], ['cc', 'Dejar en cuenta corriente']], r0.saldo > 0 ? 'cobrar' : 'cc')}</select></div>
        <div class="field"><label>Importe a cobrar (ARS)</label><input name="importe" inputmode="decimal" value="${aPesosInput(Math.max(0, r0.saldo)).replace('.', ',')}"></div>
        <div class="field"><label>Medio</label><select name="medio">${opciones(Object.entries(MEDIOS).map(([k, m]) => [k, m.nombre]), 'efectivo')}</select></div></div>
      <label class="check"><input type="checkbox" name="mant"> Enviar la unidad a mantenimiento/limpieza tras la salida</label></div></form>`,
    pie: `<button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn warnb" type="button" id="btnCo">Confirmar check-out</button>`,
    onBind: d => {
      const f = d.querySelector('#fCo');
      const leer = () => { const fd = formData(f); const imp = fd.modo === 'cobrar' ? aCentavos(fd.importe) : 0; return { fd, cobro: fd.modo === 'cobrar' ? { importe: imp, medio: fd.medio } : null, impInvalido: fd.modo === 'cobrar' && !(imp >= 0), mant: fd.mant === 'on' }; };
      const pintar = () => {
        const { cobro, impInvalido } = leer();
        f.querySelector('[name=importe]').disabled = f.querySelector('[name=medio]').disabled = !cobro;
        const pv = previsualizarCierre(id, cobro && cobro.importe > 0 ? cobro : null);
        const errs = [...pv.errores]; if (impInvalido) errs.push('Importe a cobrar inválido.');
        const r = pv.r;
        d.querySelector('#coBody').innerHTML = `
          ${errs.length ? `<div class="errors" role="alert"><b>No se puede cerrar todavía:</b><ul>${errs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>${r.ticketsAbiertos.length ? `<div class="row mt">${r.ticketsAbiertos.map(t => `<button class="btn sm" type="button" data-a="verMesa" data-v="${t.mesaId}">Resolver ${t.id} en ${t.mesaId}</button>`).join('')}</div>` : ''}</div>` : ''}
          <div class="grid12">
            <div class="card s7"><h3>Resumen de cargos y pagos</h3>${tablaCalculo(e.calc, r)}
              ${r.pagosDirectos ? `<p class="sub small mt">Pagos directos de gastronomía ya contabilizados (no se suman como cargos ni se descuentan): ${money(r.pagosDirectos)} en ${r.ticketsDirectos.map(t => t.id).join(', ')}.</p>` : '<p class="sub small mt">Sin pagos directos de gastronomía asociados.</p>'}
              <div class="hr"></div>
              <div class="detail"><dl><dt>Pagos anticipados</dt><dd>${money(r.anticipos)}</dd><dt>Otros pagos imputados</dt><dd>${money(r.pagosComunes)}</dd><dt>Cobro en este cierre</dt><dd>${money(cobro && cobro.importe > 0 ? cobro.importe : 0)}</dd><dt>Saldo final pendiente</dt><dd class="big" style="color:${pv.saldoFinal > 0 ? 'var(--warn)' : 'var(--ok)'}">${money(pv.saldoFinal)}</dd></dl></div>
              <p class="sub tiny mt">Control: Saldo = Total de cargos de la estadía (${money(r.totalCargos)}) − Pagos imputados (${money(r.totalPagos)}).</p>
            </div>
            <div class="card s5"><h3>Distribución y asiento previsto</h3>
              ${pv.liq ? `<div class="detail mb"><dl><dt>Propietario</dt><dd>${esc(pv.liq.propietario.nombre)}</dd><dt>Base liquidable (alojamiento neto)</dt><dd>${money(pv.liq.base)}</dd><dt>Propietario (${pv.liq.pctProp} %)</dt><dd>${money(pv.liq.importeProp)}</dd><dt>Comisión del club (${pv.liq.pctClub} %)</dt><dd>${money(pv.liq.importeClub)}</dd></dl><p class="sub tiny mt">Los consumos gastronómicos no integran la base de liquidación.</p></div>` : '<div class="notice info">Unidad propia del club: no corresponde liquidación a terceros.</div>'}
              ${tablaAsientoPrevisto(pv.asientos)}
            </div>
          </div>`;
        d.querySelector('#btnCo').disabled = errs.length > 0;
      };
      f.addEventListener('input', pintar); f.addEventListener('change', pintar);
      pintar();
      MODAL.refresh = () => { if (estadia(id).estado === 'activa') pintar(); };
      d.querySelector('#btnCo').addEventListener('click', async () => {
        const { cobro, mant, impInvalido } = leer();
        const pv = previsualizarCierre(id, cobro && cobro.importe > 0 ? cobro : null);
        if (!pv.ok || impInvalido) return pintar();
        const btn = d.querySelector('#btnCo'); btn.disabled = true;
        const ok = await confirmar({ titulo: 'Confirmar cierre de estancia', peligro: true, ok: 'Sí, cerrar estadía',
          html: `<p>Se cerrará la estadía <b>${e.id}</b> (${e.unidadId}) de ${esc(nombreCliente(cliente(e.clienteId)))}.</p><ul class="mt" style="margin-left:18px"><li>Saldo final: <b>${money(pv.saldoFinal)}</b>${pv.saldoFinal > 0 ? ' (queda en cuenta corriente)' : ''}</li>${pv.liq ? `<li>Liquidación al propietario: <b>${money(pv.liq.importeProp)}</b></li>` : ''}<li>${pv.asientos.length} asiento(s) contable(s)</li><li>No se podrán imputar nuevos cargos.</li></ul><p class="sub small mt">Esta operación no se puede deshacer.</p>` });
        if (!ok) { btn.disabled = false; return; }
        if (estadia(id).estado !== 'activa') return modalComprobante(id); // idempotencia ante doble confirmación
        const res = ejecutar(() => cerrarEstadia(id, { cobro: cobro && cobro.importe > 0 ? cobro : null, mantenimiento: mant }), x => `Check-out de ${x.id} completado. Saldo final ${money(x.cierre.saldo)}.`);
        if (res) modalComprobante(id); else btn.disabled = false;
      });
    }
  });
}

    </div>`,
    pie: `<button class="btn ghost" type="button" data-a="imprimir">Imprimir</button><button class="btn" type="button" data-close>Cerrar</button>`

}

  });

async function accionImputar(ticketId) {
  const t = ticket(ticketId); if (!t) return;
  const dest = $('#impDest') ? $('#impDest').value : t.estadiaId;
  if (!dest) return toast('Seleccione la estadía activa de destino.', 'warn');
  const e = estadia(dest);
  if (!e || e.estado !== 'activa') return toast('La estadía de destino no está activa.', 'error');
  const ok = await confirmar({ titulo: 'Imputar consumo a parcela', ok: 'Confirmar imputación',
    html: `<p>Se cargará <b>${money(totalTicket(t))}</b> (ticket ${t.id}, ${t.mesaId}) a la cuenta de la estadía <b>${e.id}</b> en <b>${e.unidadId}</b> de ${esc(nombreCliente(cliente(e.clienteId)))}.</p><p class="sub small mt">Asiento B: Debe Créditos por cobrar a huéspedes · Haber Ingresos por gastronomía. La mesa quedará libre.</p>` });
  if (!ok) return;
  if (ticket(ticketId).estado !== 'abierto') return toast('Este ticket ya fue cerrado. No se duplica el cargo.', 'warn');
  ejecutar(() => imputarTicket(ticketId, dest), c => `Cargo ${c.id} (${c.op}) imputado a ${c.estadiaId}: ${money(c.importe)}.`);
}
async function accionPagoDirecto(v) {
  const [ticketId, medio] = v.split('|');
  const t = ticket(ticketId); if (!t) return;
  const ok = await confirmar({ titulo: 'Registrar pago directo', ok: 'Cobrar y cerrar cuenta',
    html: `<p>Cobrar <b>${money(totalTicket(t))}</b> en <b>${MEDIOS[medio].nombre}</b> y cerrar el ticket ${t.id} (${t.mesaId}).</p>${t.estadiaId ? `<p class="sub small mt">El consumo queda pagado: no se sumará a la cuenta de ${t.estadiaId} ni se volverá a cobrar en el check-out.</p>` : ''}<p class="sub small mt">Asiento D: Debe ${MEDIOS[medio].nombre === 'Efectivo' ? 'Caja' : 'Banco'} · Haber Ingresos por gastronomía.</p>` });
  if (!ok) return;
  if (ticket(ticketId).estado !== 'abierto') return toast('Este ticket ya fue cerrado. No se duplica el cobro.', 'warn');
  ejecutar(() => pagarTicket(ticketId, medio), x => `Ticket ${x.id} cobrado: ${money(x.cierre.total)}. Mesa liberada.`);
}
