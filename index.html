const pillInst = st => `<span class="pill ${st === 'mantenimiento' ? 'mant' : st}"><span class="dot" style="background:${COLORES[st]}"></span>${INST_ESTADO_TXT[st]}</span>`;

const sinCentavos = c => money(c).replace(/,\d\d$/, '');
function metricasInst() {
  const h = hoy();
  const cobrados = S.usos.filter(usoCobrado);
  const cobradosHoy = cobrados.filter(u => u.cobro.fecha.slice(0, 10) === h);
  const ing = saldoCuenta('ING_PIL').acreedor + saldoCuenta('ING_CAN').acreedor;
  return {

        if (r) modalVerUso(id); else d.querySelector('.dlg-f [type=submit]').disabled = false;
      });
    }
  });
}

/* =====================================================================
   13. CAJA Y CONTABILIDAD (vista)
   ===================================================================== */
function asientosFiltrados() {
  const f = UI.f, q = f.asQ.toLowerCase();
  return S.asientos.filter(a => (!f.asDesde || a.fecha.slice(0, 10) >= f.asDesde) && (!f.asHasta || a.fecha.slice(0, 10) <= f.asHasta) &&
    (!f.asCuenta || a.lineas.some(l => l.cuenta === f.asCuenta)) && (!f.asOrigen || a.origen === f.asOrigen) &&
    (!q || `${a.id} ${a.concepto} ${a.ref}`.toLowerCase().includes(q)));
}
VISTAS.caja = () => {
  const tab = UI.tabCaja;
  const sc = k => saldoCuenta(k);
  const sumaSaldos = suma(S.estadias.filter(e => e.estado === 'activa' || e.estado === 'cerrada'), e => resumenEstadia(e).saldo);
  const antPend = suma(S.pagos.filter(p => p.tipo === 'anticipo' && !p.aplicado && !p.devuelto), p => p.importe);
  const liqPend = suma(S.liquidaciones.filter(l => l.estado !== 'Pagada'), l => l.importeProp);
  const ctrl = [
    ['Créditos por cobrar = Σ saldos de estadías devengadas', sc('CRED').deudor, sumaSaldos],
    ['Anticipos de clientes = Σ anticipos de estadías + señas de pileta y canchas sin aplicar', sc('ANT').acreedor, antPend + senasPendientesUsos()],
    ['Cuentas por pagar a propietarios = Σ liquidaciones pendientes', sc('PROP').acreedor, liqPend],
    ['Ingresos por gastronomía = Σ tickets cerrados', sc('ING_GAS').acreedor, suma(S.tickets.filter(t => t.estado === 'pagado' || t.estado === 'imputado'), totalTicket)],
    ['Ingresos por pileta y canchas = Σ entradas y reservas cobradas (bruto)', sc('ING_PIL').acreedor + sc('ING_CAN').acreedor, suma(S.usos.filter(usoCobrado), u => u.calc.subtotal)],
    ['Descuentos de pileta y canchas = Σ descuentos de socio aplicados', sc('DESC_INS').deudor, suma(S.usos.filter(usoCobrado), u => u.calc.descuento)]
  ];
  const tabs = [['diario', 'Libro diario'], ['balance', 'Sumas y saldos'], ['tesoreria', 'Caja y bancos'], ['politica', 'Política contable']];
  let body = '';
  if (tab === 'diario') {
    const as = asientosFiltrados();
    const f = UI.f;
    let td = 0, th = 0;
    const filas = as.map(a => {
      const d = suma(a.lineas, l => l.debe), h = suma(a.lineas, l => l.haber), ok = Math.abs(d - h) <= APP.toleranciaCentavos;
      td += d; th += h;
      return a.lineas.map((l, i) => `<tr class="${i === 0 ? 'sep' : ''}"><td>${i === 0 ? fFechaHora(a.fecha) : ''}</td><td class="mono">${i === 0 ? a.id : ''}</td><td class="small">${i === 0 ? `${esc(a.concepto)} <span class="sub">· ref. ${esc(a.ref)}</span> ${pillOrigen(a.origen)}` : ''}</td><td class="small" style="padding-left:${l.haber ? 28 : 10}px">${esc(CUENTAS[l.cuenta].cod)} ${esc(CUENTAS[l.cuenta].nombre)}</td><td class="num">${l.debe ? money(l.debe) : ''}</td><td class="num">${l.haber ? money(l.haber) : ''}</td><td>${i === 0 ? (ok ? '<span class="pill ok">✓ Balanceado</span>' : '<span class="pill bad">✕ Error</span>') : ''}</td></tr>`).join('');
    }).join('');
    body = `<div class="filters">
      <div class="field"><label for="fAsD">Desde</label><input id="fAsD" type="date" data-f="asDesde" value="${esc(f.asDesde)}"></div>
      <div class="field"><label for="fAsH">Hasta</label><input id="fAsH" type="date" data-f="asHasta" value="${esc(f.asHasta)}"></div>
      <div class="field"><label for="fAsC">Cuenta</label><select id="fAsC" data-f="asCuenta"><option value="">Todas</option>${opciones(Object.entries(CUENTAS).map(([k, c]) => [k, c.cod + ' ' + c.nombre]), f.asCuenta)}</select></div>
      <div class="field"><label for="fAsO">Origen</label><select id="fAsO" data-f="asOrigen">${opciones([['', 'Todos'], ['demo', 'Datos iniciales'], ['usuario', 'Movimientos del usuario']], f.asOrigen)}</select></div>
      <div class="field" style="flex:1;min-width:160px"><label for="fAsQ">Buscar</label><input id="fAsQ" data-f="asQ" value="${esc(f.asQ)}" placeholder="Número, concepto o referencia"></div>
      <button class="btn ghost sm" type="button" data-a="limpiarFiltrosAs">Limpiar</button></div>
      <div class="card"><div class="tw"><table><thead><tr><th>Fecha</th><th>Número</th><th>Concepto</th><th>Cuenta</th><th class="num">Debe</th><th class="num">Haber</th><th>Estado</th></tr></thead>
      <tbody>${filas || `<tr><td colspan="7">${vacio('Sin asientos para los filtros elegidos')}</td></tr>`}</tbody>
      ${as.length ? `<tfoot><tr><td colspan="4">Totales (${as.length} asientos)</td><td class="num">${money(td)}</td><td class="num">${money(th)}</td><td>${td === th ? '<span class="pill ok">Debe = Haber</span>' : '<span class="pill bad">Diferencia</span>'}</td></tr></tfoot>` : ''}</table></div></div>`;
  } else if (tab === 'balance') {
    let tD = 0, tH = 0;
    const filas = Object.entries(CUENTAS).map(([k, c]) => { const s = sc(k); tD += s.debe; tH += s.haber; return `<tr><td class="mono">${c.cod}</td><td>${esc(c.nombre)}</td><td>${c.tipo}</td><td class="num">${money(s.debe)}</td><td class="num">${money(s.haber)}</td><td class="num">${s.deudor > 0 ? money(s.deudor) : ''}</td><td class="num">${s.deudor < 0 ? money(-s.deudor) : ''}</td></tr>`; }).join('');
    body = `<div class="card"><h3>Balance de sumas y saldos</h3><div class="tw"><table><thead><tr><th>Código</th><th>Cuenta</th><th>Tipo</th><th class="num">Debe</th><th class="num">Haber</th><th class="num">Saldo deudor</th><th class="num">Saldo acreedor</th></tr></thead><tbody>${filas}</tbody>
      <tfoot><tr><td colspan="3">Totales</td><td class="num">${money(tD)}</td><td class="num">${money(tH)}</td><td colspan="2">${tD === tH ? '<span class="pill ok">Balanceado</span>' : '<span class="pill bad">Descuadre</span>'}</td></tr></tfoot></table></div>
      <p class="sub small mt">«Inventario gastronómico» se incluye como cuenta de referencia: la demo controla el stock en unidades y no registra costo de ventas.</p></div>`;
  } else if (tab === 'tesoreria') {
    const movs = [];
    S.asientos.forEach(a => a.lineas.forEach(l => { if (l.cuenta === 'CAJA' || l.cuenta === 'BANCO') movs.push({ a, l }); }));
    let saldoC = 0, saldoB = 0;
    const filas = movs.map(({ a, l }) => { if (l.cuenta === 'CAJA') saldoC += l.debe - l.haber; else saldoB += l.debe - l.haber; return `<tr><td>${fFechaHora(a.fecha)}</td><td class="mono">${a.id}</td><td class="small">${esc(a.concepto)}</td><td>${CUENTAS[l.cuenta].nombre}</td><td class="num" style="color:var(--ok)">${l.debe ? money(l.debe) : ''}</td><td class="num" style="color:var(--bad)">${l.haber ? money(l.haber) : ''}</td><td class="num">${money(l.cuenta === 'CAJA' ? saldoC : saldoB)}</td></tr>`; }).reverse().join('');
    body = `<div class="card"><h3>Movimientos de caja y bancos</h3><div class="tw"><table><thead><tr><th>Fecha</th><th>Asiento</th><th>Concepto</th><th>Cuenta</th><th class="num">Ingreso</th><th class="num">Egreso</th><th class="num">Saldo de la cuenta</th></tr></thead><tbody>${filas || `<tr><td colspan="7">${vacio('Sin movimientos')}</td></tr>`}</tbody></table></div></div>`;
  } else {
    body = `<div class="card"><h3>Política contable aplicada en la demo</h3><div class="col small" style="max-width:860px;gap:12px">
      <p><b>Modelo de reconocimiento bruto, aplicado de forma consistente.</b> La estadía se registra por su importe total en «Ingresos por estadía» al realizar el check-in (asiento A). El descuento de socio se registra separado en «Descuentos otorgados».</p>
      <p><b>Unidades de terceros:</b> al cerrar la estadía se reclasifica la porción del propietario: Debe «Ingresos por estadía» / Haber «Cuentas por pagar a propietarios» (asiento F). El ingreso que permanece es la comisión del club; la obligación con el propietario queda identificada hasta su pago (Debe Propietarios / Haber Caja o Banco).</p>
      <p><b>Consumos:</b> imputados a una estadía → Debe Créditos / Haber Ingresos por gastronomía (B). Pagados directamente → Debe Caja o Banco / Haber Ingresos por gastronomía (D). Nunca se cobran dos veces.</p>
      <p><b>Pileta y canchas:</b> el ingreso se reconoce al cobrar el uso (entrada vendida o reserva del día): Debe Caja/Banco (o Créditos si se carga a la parcela) + Anticipos de clientes (seña) + Descuentos de pileta y canchas / Haber Ingresos por pileta o por canchas (G). La seña de una reserva va a «Anticipos de clientes» (H) y se devuelve si la reserva se cancela. Un uso cargado a una parcela suma un cargo a la estadía y se cobra en el check-out, igual que un consumo gastronómico.</p>
      <p><b>Cobros:</b> Debe Caja (efectivo) o Banco (transferencia) / Haber Créditos (C). Los anticipos de reservas van a «Anticipos de clientes» (E) y se aplican contra Créditos al hacer el check-in, sin duplicar ingresos ni cobros. Si se cancela una reserva, el anticipo se devuelve.</p>
      <p><b>Validación:</b> cada asiento se verifica antes de guardarse con importes enteros en centavos; la tolerancia de redondeo es ${APP.toleranciaCentavos} centavos. Las operaciones son atómicas: si una validación falla, no queda ningún cambio parcial.</p>
      <p class="sub">Alcance: simulación para validar procesos. No es un sistema contable certificado ni garantiza el cumplimiento de normas fiscales argentinas.</p></div></div>`;
  }
  return `<div class="kpis">
    ${kpi('Caja', money(sc('CAJA').deudor), 'Efectivo')}${kpi('Banco', money(sc('BANCO').deudor), 'Transferencias')}
    ${kpi('Créditos por cobrar', money(sc('CRED').deudor), 'Huéspedes', 'warn')}${kpi('Anticipos de clientes', money(sc('ANT').acreedor), 'Pasivo')}
    ${kpi('A pagar a propietarios', money(sc('PROP').acreedor), 'Pasivo')}${kpi('Pileta y canchas', money(sc('ING_PIL').acreedor + sc('ING_CAN').acreedor - sc('DESC_INS').deudor), 'Ingresos netos de descuentos', 'acc')}${kpi('Asientos', S.asientos.length, S.asientos.every(a => suma(a.lineas, l => l.debe) === suma(a.lineas, l => l.haber)) ? 'Todos balanceados' : 'Hay descuadres', 'acc')}
  </div>
  <div class="card mb"><h3>Controles de integridad (libro vs. operaciones)</h3><div class="tw"><table><tbody>${ctrl.map(c => `<tr><td class="small">${c[0]}</td><td class="num">${money(c[1])}</td><td class="num">${money(c[2])}</td><td>${c[1] === c[2] ? '<span class="pill ok">✓ Coincide</span>' : '<span class="pill bad">✕ Difiere</span>'}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab ${tab === k ? 'on' : ''}" type="button" role="tab" aria-selected="${tab === k}" data-a="tabCaja" data-v="${k}">${l}</button>`).join('')}</div>${body}`;
};

/* =====================================================================
   14. REPORTES
   ===================================================================== */
function enRango(fecha) { const f = UI.f; const d = (fecha || '').slice(0, 10); return (!f.repDesde || d >= f.repDesde) && (!f.repHasta || d <= f.repHasta); }
function barras(items, total) {
  return items.length ? `<div class="tw"><table><tbody>${items.map(([l, v, extra]) => `<tr><td>${l}</td><td style="width:40%"><div class="bar"><i style="width:${total ? Math.max(2, v / total * 100) : 0}%"></i></div></td><td class="num">${money(v)}</td>${extra !== undefined ? `<td class="num sub small">${extra}</td>` : ''}</tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td></td><td class="num">${money(total)}</td>${items[0][2] !== undefined ? '<td></td>' : ''}</tr></tfoot></table></div>` : vacio('Sin registros', 'No hay datos para el período o filtro elegido.');
}
VISTAS.reportes = () => {
  const tab = UI.tabReportes, f = UI.f;
  const tabs = [['estadias', 'Estadías'], ['area', 'Consumos por área'], ['parcela', 'Consumos por parcela'], ['productos', 'Ventas por producto'], ['instalaciones', 'Pileta y canchas'], ['saldos', 'Saldos pendientes'], ['liquidaciones', 'Liquidaciones'], ['asientos', 'Asientos contables']];
  const cerrados = S.tickets.filter(t => (t.estado === 'pagado' || t.estado === 'imputado') && enRango(t.cierre.fecha) && (!f.repArea || t.area === f.repArea));
  let body = '', filtrosExtra = '';
  if (tab === 'estadias') {
    filtrosExtra = `<div class="field"><label for="fRepE">Estado</label><select id="fRepE" data-f="repEstado">${opciones([['todas', 'Activas y cerradas'], ['activa', 'Activas'], ['cerrada', 'Cerradas']], f.repEstado)}</select></div>`;
    const es = S.estadias.filter(e => (f.repEstado === 'todas' ? ['activa', 'cerrada'].includes(e.estado) : e.estado === f.repEstado) && enRango(e.ingreso));
    const rs = es.map(e => [e, resumenEstadia(e)]);
    body = `<div class="card"><div class="tw"><table><thead><tr><th>Estadía</th><th>Unidad</th><th>Huésped</th><th>Ingreso</th><th>Salida</th><th>Estado</th><th class="num">Alojamiento</th><th class="num">Descuento</th><th class="num">Consumos</th><th class="num">Pagos</th><th class="num">Saldo</th></tr></thead><tbody>
      ${rs.map(([e, r]) => `<tr class="click" data-a="verEstadia" data-v="${e.id}"><td class="mono">${e.id}</td><td>${e.unidadId}</td><td>${esc(nombreCliente(cliente(e.clienteId)))}</td><td>${fFecha(e.ingreso)}</td><td>${fFecha(e.salida)}</td><td>${pillEstadia(e.estado)}</td><td class="num">${money(r.alojamiento)}</td><td class="num">${money(e.calc.descuento)}</td><td class="num">${money(r.consumos)}</td><td class="num">${money(r.totalPagos)}</td><td class="num">${money(r.saldo)}</td></tr>`).join('') || `<tr><td colspan="11">${vacio('Sin estadías en el período')}</td></tr>`}</tbody>
      ${rs.length ? `<tfoot><tr><td colspan="6">Totales (${rs.length})</td><td class="num">${money(suma(rs, x => x[1].alojamiento))}</td><td class="num">${money(suma(rs, x => x[0].calc.descuento))}</td><td class="num">${money(suma(rs, x => x[1].consumos))}</td><td class="num">${money(suma(rs, x => x[1].totalPagos))}</td><td class="num">${money(suma(rs, x => x[1].saldo))}</td></tr></tfoot>` : ''}</table></div></div>`;
  } else if (tab === 'area') {
    filtrosExtra = `<div class="field"><label for="fRepA">Área</label><select id="fRepA" data-f="repArea">${opciones([['', 'Todas'], ...Object.entries(AREAS)], f.repArea)}</select></div>`;
    const items = Object.entries(AREAS).filter(([k]) => !f.repArea || k === f.repArea).map(([k, n]) => { const ts = cerrados.filter(t => t.area === k); return [`${n} <span class="sub small">(${ts.length} tickets · imputado ${money(suma(ts.filter(t => t.estado === 'imputado'), totalTicket))} · directo ${money(suma(ts.filter(t => t.estado === 'pagado'), totalTicket))})</span>`, suma(ts, totalTicket)]; }).filter(x => x[1] > 0);
    body = `<div class="card"><h3>Consumos cerrados por área gastronómica</h3>${barras(items, suma(items, x => x[1]))}<p class="sub small mt">Las cuentas abiertas (${money(suma(S.tickets.filter(t => t.estado === 'abierto'), totalTicket))}) no se incluyen hasta su cierre.</p></div>`;
  } else if (tab === 'parcela') {
    filtrosExtra = `<div class="field"><label for="fRepA">Área</label><select id="fRepA" data-f="repArea">${opciones([['', 'Todas'], ...Object.entries(AREAS)], f.repArea)}</select></div>`;
    const cs = S.cargos.filter(c => enRango(c.fecha) && (!f.repArea || c.area === f.repArea));
    const items = S.unidades.map(u => { const x = cs.filter(c => c.unidadId === u.id); return [`<b>${u.id}</b> <span class="sub small">${esc(u.nombre)}</span>`, suma(x, c => c.importe), x.length + ' cargo(s)']; }).filter(x => x[1] > 0);
    body = `<div class="card"><h3>Consumos imputados por parcela/unidad</h3>${barras(items, suma(items, x => x[1]))}</div>`;
  } else if (tab === 'productos') {
    filtrosExtra = `<div class="field"><label for="fRepA">Área</label><select id="fRepA" data-f="repArea">${opciones([['', 'Todas'], ...Object.entries(AREAS)], f.repArea)}</select></div>`;
    const map = {};
    cerrados.forEach(t => t.lineas.forEach(l => { const m = map[l.productoId] || (map[l.productoId] = { nombre: l.nombre, cant: 0, venta: 0, costo: 0 }); m.cant += l.cantidad; m.venta += l.precio * l.cantidad; m.costo += (l.costo || 0) * l.cantidad; }));
    const arr = Object.entries(map).sort((a, b) => b[1].venta - a[1].venta);
    body = `<div class="card"><h3>Ventas por producto (tickets cerrados)</h3>${arr.length ? `<div class="tw"><table><thead><tr><th>Producto</th><th class="num">Unidades</th><th class="num">Venta</th><th class="num">Costo ref.</th><th class="num">Margen bruto</th></tr></thead><tbody>${arr.map(([id, m]) => `<tr><td>${esc(m.nombre)} <span class="sub tiny">${id}</span></td><td class="num">${m.cant}</td><td class="num">${money(m.venta)}</td><td class="num">${money(m.costo)}</td><td class="num">${money(m.venta - m.costo)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td class="num">${suma(arr, x => x[1].cant)}</td><td class="num">${money(suma(arr, x => x[1].venta))}</td><td class="num">${money(suma(arr, x => x[1].costo))}</td><td class="num">${money(suma(arr, x => x[1].venta - x[1].costo))}</td></tr></tfoot></table></div>` : vacio('Sin ventas en el período')}</div>`;
  } else if (tab === 'instalaciones') {
    filtrosExtra = `<div class="field"><label for="fRepI">Instalación</label><select id="fRepI" data-f="repInst">${opciones([['', 'Todas'], ...S.instalaciones.map(i => [i.id, i.nombre])], f.repInst)}</select></div>`;
    const us = S.usos.filter(u => enRango(u.fecha) && (!f.repInst || u.inst === f.repInst));
    const cob = us.filter(usoCobrado);
    const filas = S.instalaciones.filter(i => !f.repInst || i.id === f.repInst).map(i => {
      const x = cob.filter(u => u.inst === i.id), imp = suma(x.filter(u => u.estado === 'imputada'), u => u.cobro.importe), neto = suma(x, u => u.calc.total);
      return { i, n: x.length, uni: i.clase === 'pileta' ? suma(x, u => u.personas) + ' pers.' : suma(x, u => u.horas) + ' h', bruto: suma(x, u => u.calc.subtotal), desc: suma(x, u => u.calc.descuento), neto, imp, caja: neto - imp, pend: us.filter(u => u.inst === i.id && u.estado === 'reservada').length };
    });
    const items = filas.filter(r => r.neto > 0).map(r => [`<b>${esc(r.i.nombre)}</b> <span class="sub small">${r.n} operación(es) · ${r.uni}</span>`, r.neto]);
    body = `<div class="card mb"><h3>Ingresos por instalación (cobrados)</h3>${filas.length ? `<div class="tw"><table><thead><tr><th>Instalación</th><th class="num">Operaciones</th><th class="num">Uso</th><th class="num">Bruto</th><th class="num">Descuentos</th><th class="num">Neto</th><th class="num">Caja / banco (incl. señas)</th><th class="num">Cargado a parcelas</th><th class="num">Reservas pendientes</th></tr></thead><tbody>
      ${filas.map(r => `<tr><td><b>${esc(r.i.nombre)}</b></td><td class="num">${r.n}</td><td class="num">${r.uni}</td><td class="num">${money(r.bruto)}</td><td class="num">${money(r.desc)}</td><td class="num"><b>${money(r.neto)}</b></td><td class="num">${money(r.caja)}</td><td class="num">${money(r.imp)}</td><td class="num">${r.pend}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Totales</td><td class="num">${suma(filas, r => r.n)}</td><td></td><td class="num">${money(suma(filas, r => r.bruto))}</td><td class="num">${money(suma(filas, r => r.desc))}</td><td class="num">${money(suma(filas, r => r.neto))}</td><td class="num">${money(suma(filas, r => r.caja))}</td><td class="num">${money(suma(filas, r => r.imp))}</td><td class="num">${suma(filas, r => r.pend)}</td></tr></tfoot></table></div>` : vacio('Sin datos')}</div>
      <div class="grid12"><div class="card s5"><h3>Participación en el neto</h3>${barras(items, suma(items, x => x[1]))}</div>
      <div class="card s7"><h3>Detalle de operaciones cobradas</h3>${cob.length ? `<div class="tw"><table><thead><tr><th>Código</th><th>Fecha</th><th>Instalación</th><th>Cliente</th><th>Estado</th><th class="num">Neto</th></tr></thead><tbody>${cob.slice().reverse().map(u => `<tr class="click" data-a="verUso" data-v="${u.id}"><td class="mono">${u.id}</td><td>${fFecha(u.fecha)}</td><td>${esc(instalacion(u.inst).nombre)}</td><td>${esc(nombreUso(u))}</td><td>${pillUso(u.estado)}</td><td class="num">${money(u.calc.total)}</td></tr>`).join('')}</tbody></table></div>` : vacio('Sin operaciones cobradas en el período')}</div></div>`;
  } else if (tab === 'saldos') {
    const es = S.estadias.filter(e => (e.estado === 'activa' || e.estado === 'cerrada') && enRango(e.ingreso)).map(e => [e, resumenEstadia(e)]).filter(x => x[1].saldo !== 0);
    const porCli = {}; es.forEach(([e, r]) => { porCli[e.clienteId] = (porCli[e.clienteId] || 0) + r.saldo; });
    body = `<div class="grid12"><div class="card s7"><h3>Saldos por estadía</h3>${es.length ? `<div class="tw"><table><thead><tr><th>Estadía</th><th>Unidad</th><th>Huésped</th><th>Estado</th><th class="num">Saldo</th></tr></thead><tbody>${es.map(([e, r]) => `<tr class="click" data-a="verEstadia" data-v="${e.id}"><td class="mono">${e.id}</td><td>${e.unidadId}</td><td>${esc(nombreCliente(cliente(e.clienteId)))}</td><td>${pillEstadia(e.estado)}</td><td class="num"><b>${money(r.saldo)}</b></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">Total por cobrar</td><td class="num">${money(suma(es, x => x[1].saldo))}</td></tr></tfoot></table></div>` : vacio('Sin saldos pendientes')}</div>
      <div class="card s5"><h3>Por cliente</h3>${barras(Object.entries(porCli).map(([cid, v]) => [esc(nombreCliente(cliente(cid))), v]), suma(Object.values(porCli)))}</div></div>`;
  } else if (tab === 'liquidaciones') {
    const ls = S.liquidaciones.filter(l => enRango(l.fecha));
    body = `<div class="card"><h3>Liquidaciones a propietarios</h3>${ls.length ? `<div class="tw"><table><thead><tr><th>Liquidación</th><th>Fecha</th><th>Unidad</th><th>Propietario</th><th class="num">Base</th><th class="num">Propietario</th><th class="num">Club</th><th>Estado</th></tr></thead><tbody>${ls.map(l => `<tr><td class="mono">${l.id}</td><td>${fFechaHora(l.fecha)}</td><td>${l.unidadId}</td><td>${esc(propietario(l.propietarioId).nombre)}</td><td class="num">${money(l.base)}</td><td class="num">${money(l.importeProp)}</td><td class="num">${money(l.importeClub)}</td><td>${l.estado === 'Pagada' ? '<span class="pill ok">Pagada</span>' : '<span class="pill warn">Pendiente</span>'}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">Totales</td><td class="num">${money(suma(ls, l => l.base))}</td><td class="num">${money(suma(ls, l => l.importeProp))}</td><td class="num">${money(suma(ls, l => l.importeClub))}</td><td></td></tr></tfoot></table></div>` : vacio('Sin liquidaciones en el período')}</div>`;
  } else {
    const as = S.asientos.filter(a => enRango(a.fecha));
    const porCuenta = Object.entries(CUENTAS).map(([k, c]) => { let d = 0, h = 0; as.forEach(a => a.lineas.forEach(l => { if (l.cuenta === k) { d += l.debe; h += l.haber; } })); return [c, d, h]; }).filter(x => x[1] || x[2]);
    body = `<div class="card"><h3>Movimiento por cuenta en el período (${as.length} asientos)</h3>${porCuenta.length ? `<div class="tw"><table><thead><tr><th>Cuenta</th><th class="num">Debe</th><th class="num">Haber</th></tr></thead><tbody>${porCuenta.map(([c, d, h]) => `<tr><td>${c.cod} ${esc(c.nombre)}</td><td class="num">${money(d)}</td><td class="num">${money(h)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Totales</td><td class="num">${money(suma(porCuenta, x => x[1]))}</td><td class="num">${money(suma(porCuenta, x => x[2]))}</td></tr></tfoot></table></div><button class="btn ghost sm mt" type="button" data-a="go" data-v="caja">Ver libro diario completo</button>` : vacio('Sin asientos en el período')}</div>`;
  }
  return `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab ${tab === k ? 'on' : ''}" type="button" role="tab" aria-selected="${tab === k}" data-a="tabReportes" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="filters"><div class="field"><label for="fRepD">Desde</label><input id="fRepD" type="date" data-f="repDesde" value="${esc(f.repDesde)}"></div><div class="field"><label for="fRepH">Hasta</label><input id="fRepH" type="date" data-f="repHasta" value="${esc(f.repHasta)}"></div>${filtrosExtra}<button class="btn ghost sm" type="button" data-a="limpiarFiltrosRep">Limpiar filtros</button></div>${body}`;
};

  depDia: v => { const base = esFechaISO(UI.f.depFecha) ? UI.f.depFecha : hoy(); UI.f.depFecha = v === '0' ? '' : sumarDias(base, +v); render(); },
  iniMantInst: v => abrirModal({ titulo: `Enviar «${instalacion(v).nombre}» a mantenimiento`, ancho: 'narrow', cuerpo: `<form id="fMantInst" novalidate><div class="field"><label>Motivo</label><input name="motivo" maxlength="120" placeholder="Riego, pintura de líneas, limpieza de la pileta…"></div><p class="sub small">No se puede enviar a mantenimiento si tiene reservas pendientes.</p></form>`, pie: `<button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn warnb" type="submit" form="fMantInst">Enviar a mantenimiento</button>`, onBind: d => d.querySelector('#fMantInst').addEventListener('submit', ev => { ev.preventDefault(); if (ejecutar(() => setMantInst(v, true, formData(ev.target).motivo), `${instalacion(v).nombre} en mantenimiento.`)) cerrarModal(); }) }),
  finMantInst: async v => { const ok = await confirmar({ titulo: 'Finalizar mantenimiento', ok: 'Habilitar', html: `<p><b>${esc(instalacion(v).nombre)}</b> quedará disponible para reservas y ventas.</p>` }); if (ok) ejecutar(() => setMantInst(v, false), `${instalacion(v).nombre} habilitada.`); },
  resetDemo: async () => {
    const ok = await confirmar({ titulo: 'Restablecer datos de demostración', peligro: true, ok: 'Restablecer', html: '<p>Se eliminarán todos los movimientos registrados y se recargarán los datos ficticios iniciales.</p><p class="sub small mt">Esta acción no se puede deshacer.</p>' });
    if (ok) { restablecerDemo(); cerrarModal(); render(); toast('Datos de demostración restablecidos.'); }
  },
  resetIncompatible: async () => {
    const ok = await confirmar({ titulo: 'Reinicializar datos', peligro: true, ok: 'Reinicializar', html: '<p>Los datos guardados incompatibles serán reemplazados por la demo inicial.</p>' });
    if (ok) { restablecerDemo(); render(); toast('Datos reinicializados.'); }
  },
  exportar: () => {
    const blob = new Blob([serializar(S)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `camping-demo-${hoy()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  runTests: () => { UI.tests = ejecutarPruebas(); render(); const f = UI.tests.filter(x => !x.ok).length; toast(f ? `${f} prueba(s) con fallas.` : `Las ${UI.tests.length} pruebas funcionales fueron superadas.`, f ? 'error' : 'ok'); }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el) {
    if ($('#app').classList.contains('open') && !ev.target.closest('.sb') && !ev.target.closest('#burger')) $('#app').classList.remove('open');
    return;
  }
  if (el.disabled) return;
  const fn = ACCIONES[el.dataset.a];
  if (!fn) return;
  ev.preventDefault();
  if (el.tagName === 'BUTTON' && !/^(go|sel|ver|tab|nueva|nuevo|editar|limpiar)/.test(el.dataset.a)) { el.disabled = true; setTimeout(() => { if (document.contains(el)) el.disabled = false; }, 600); }
  fn(el.dataset.v, el);
});
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('unit')) { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  if (ev.key === 'Escape' && $('#app').classList.contains('open')) $('#app').classList.remove('open');
});
document.addEventListener('input', ev => {
  const k = ev.target.dataset && ev.target.dataset.f;
  if (k) { UI.f[k] = ev.target.value; render(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.f && t.tagName === 'SELECT') { UI.f[t.dataset.f] = t.value; render(); }
  if (t.dataset && t.dataset.ticketEstadia) ejecutar(() => asociarEstadiaTicket(t.dataset.ticketEstadia, t.value || null), x => x.estadiaId ? `Ticket ${x.id} asociado a ${x.estadiaId}.` : `Ticket ${x.id} sin parcela asociada.`);
});
document.addEventListener('submit', ev => {
  if (ev.target.id === 'fCfg') { ev.preventDefault(); const fd = formData(ev.target); fd.recargoSobreAdicionales = fd.recargoSobreAdicionales === 'on'; ejecutar(() => guardarConfig(fd), 'Parámetros guardados. Aplican a nuevas estadías.'); }
  if (ev.target.id === 'fTemp') { ev.preventDefault(); ejecutar(() => agregarTemporada(formData(ev.target)), 'Período de temporada alta agregado.'); }
  if (ev.target.id === 'fCfgMem') { ev.preventDefault(); ejecutar(() => guardarMembresia(formData(ev.target)), 'Membresías y sitio público actualizados.'); }
  if (ev.target.id === 'fSocio') {
    ev.preventDefault();
    const fd = formData(ev.target); fd.acepta = fd.acepta === 'on';
    const errs = validarSolicitud(fd);
    if (errs.length) { mostrarErrores($('#errSocio'), errs); return; }
    const r = ejecutar(() => crearSolicitud(fd), x => `Solicitud ${x.id} enviada. ¡Gracias!`);
    if (r) { UI.solicitudEnviada = r.id; render(); const el = $('#pub-form'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' }); }
  }
  if (ev.target.id === 'fCfgInst') { ev.preventDefault(); ejecutar(() => guardarConfigInst(formData(ev.target)), 'Tarifas de pileta y canchas guardadas. Aplican a nuevas ventas y reservas.'); }
});
$('#burger').addEventListener('click', ev => { ev.stopPropagation(); $('#app').classList.toggle('open'); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TITULOS[h] && h !== UI.route) { UI.route = h; render(); } });

/* =====================================================================
   16. INICIALIZACIÓN
   ===================================================================== */
function init() {
  aplicarTema(temaInicial());
  cargarInicial();
  const h = location.hash.slice(1);
  if (TITULOS[h]) UI.route = h;
  render();
  if (PERSIST.problema === 'sin-storage') toast('Almacenamiento local no disponible: la demo funciona en memoria.', 'info');
  // Reloj del encabezado: refresca la fecha si cambia el día con la app abierta
  let dia = hoy();
  setInterval(() => { if (hoy() !== dia) { dia = hoy(); render(); } }, 60000);
}
window.SVB = { ejecutarPruebas, estado: () => S, version: APP.schema };
init();
</script>
</body>
</html>
